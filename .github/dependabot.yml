version: 2

# `cosyte/.github` hosts the org-wide REUSABLE workflows. Every library is a thin caller, so an
# action bump here reaches a caller once it names a reference that carries the bump (or at once, for
# a caller still on `@main`). Dependabot is configured for `github-actions` only: this repo has no
# npm or pnpm package and therefore no language ecosystem to track.
#
# The commit message, and so the pull request title, is `chore(deps): bump ...`: Conventional
# Commits, which `self-pr-title.yml` checks on every pull request here. Without a prefix Dependabot
# guesses one from the repository's history, and a guess is not a title rule.

updates:
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    commit-message:
      prefix: chore
      include: scope
