name: CI

# Reusable CI for @cosyte/* packages.
# Caller (each repo's .github/workflows/ci.yml):
#   jobs:
#     ci:
#       uses: cosyte/.github/.github/workflows/ci.yml@workflows-YYYY-MM-DD-COMMIT
#       with: { run-phi-scan: true }      # byte/PHI parsers
#
# ▶ NAME A PUBLISHED REFERENCE, NOT `@main`. A reference at the default branch delivers every later
#   change made here on THIS repository's clock rather than yours, reviewed by nobody in your
#   repository; a published reference names one commit and never moves. Take the newest from
#   https://github.com/cosyte/.github/releases, whose notes say what adopting it asks of a caller.
#   README.md, "The published reference", owns the rest.
#
# Universal gates: typecheck . lint(--max-warnings=0) . format:check . [PHI scan] . test .
# coverage(gating) . build . attw . dual ESM/CJS smoke . actionlint. Actions are pinned to SHAs.
#
# Plus the two PRE-PUBLISH layers, in their own `prepublish` job below. Everything in `verify` reads
# the working tree, where the monorepo's own resolution is in scope and every sibling is a directory
# on disk; `release.yml`'s install gate asks the consumer's question but only AFTER the publish is
# permanent. These two ask it BEFORE, which is the only place it can prevent anything. See
# `scripts/prepublish-check.mjs` and the README's "The two pre-publish layers".

on:
  workflow_call:
    inputs:
      # THE NODE LINES A CALLER TESTS WHEN IT PASSES NO LIST OF ITS OWN: 22, 24 and 26, lowest
      # first, because `prepublish` below installs the packed tarball on the FIRST entry. A caller
      # whose suite or `engines.node` cannot run on 26 yet passes `'["22", "24"]'` until it can, and
      # a changed default here is a change every caller that passes nothing must act on.
      node-versions:
        description: "JSON array of Node versions for the matrix."
        type: string
        default: '["22", "24", "26"]'
      # `verify` runs on each entry. Every shared step in it is proven on `ubuntu-latest`,
      # `windows-latest` and `macos-latest` by `self-check.yml`'s `systems` job, which runs this
      # workflow on all three against `test/fixtures/ci-caller/`; README.md, "Every system and
      # runtime", says what that run proves and what it cannot. A caller widens this with
      # `os: '["ubuntu-latest", "windows-latest", "macos-latest"]'`.
      os:
        description: "JSON array of runner OSes for the matrix."
        type: string
        default: '["ubuntu-latest"]'
      run-phi-scan:
        description: "Run the repo's PHI scanner (pnpm phi-scan)."
        type: boolean
        default: false
      # 🛑 SETTING THIS FALSE DOES NOT STRAND A PULL REQUEST. IT SILENTLY UN-REQUIRES THE GATE, which
      # is the quiet direction rather than the loud one. The job below carries a JOB-LEVEL `if:` on
      # this input, and a job skipped by a conditional SATISFIES its required context: the check run
      # is still emitted as `<caller job id> / actionlint`, its conclusion is `skipped`, and GitHub
      # treats that as successful. So a caller whose ruleset requires `ci / actionlint` keeps a green
      # merge button and a context that has stopped proving anything, with nothing saying so.
      # Measured live rather than reasoned, on this exact JOB shape, in `cosyte/.github#46`; the
      # probe called its reusable workflow locally rather than remotely and nothing rests on that
      # axis, which is disclosed there rather than glossed. The primary source, the negative control
      # and the step-level contrast are in that repo's README.md under
      # "What a skipped required context does to a merge". Whether the input should exist at all is a
      # policy question for the thirteen callers and is deliberately not answered here.
      run-actionlint:
        description: "Lint the repo's workflow files with actionlint."
        type: boolean
        default: true
      # LAYER 1. Offline, no npm, no network, no install: the consumer-facing dependency fields must
      # carry only specifiers a registry can resolve. ON BY DEFAULT, and that is a measurement rather
      # than a preference. Run against all thirteen callers on 2026-08-05 it produced ZERO findings,
      # `transform` and `synth` included, because the `file:vendor/*.tgz` specifiers that survive in
      # seven repos are all in `devDependencies`, which no consumer installs and which this
      # deliberately does not read. So turning it on reds nobody today and catches the exact defect
      # that put `@cosyte/cli@0.0.1` and `0.0.2` on the registry permanently uninstallable.
      run-prepublish-manifest-lint:
        description: "Refuse a dependency specifier a registry cannot resolve (offline)."
        type: boolean
        default: true
      # LAYER 2. `npm pack` the tree, install THAT TARBALL into a clean anonymous directory, and load
      # what it declares. ON BY DEFAULT since 2026-08-05, by founder call. That was always the shape
      # of the remaining question: the mechanism was finished and measured, and what was left was a
      # policy call with a real blast radius rather than a build. As of that date no caller passes
      # this input, so the default is the whole story and the flip turned layer 2 on for all thirteen
      # at once. Measured the same day against the live registry with the default allowance below:
      # 11 `pass`, 2 `blocked-peer` (`transform` and `synth`, on `@cosyte/fhir`), 0 red, and both
      # `blocked-peer` results exit 0, so the flip reds nobody. Read those as a dated measurement,
      # not a standing guarantee; the registry is not ours and the answer can change under us.
      # It costs a full install per run and touches the network on every pull request. That price is
      # now accepted rather than overlooked, because this is the only place a consumer's install
      # question can be asked while the answer can still prevent a permanent publish (ADR 0001).
      # A caller that cannot pay it opts out with `run-prepublish-install: false`.
      run-prepublish-install:
        description: "Pack the tree and install the tarball into a clean directory."
        type: boolean
        default: true
      # THE DECLARED ALLOWANCE, and the same input `release.yml` takes, in the same grammar. A repo
      # names its known-unpublished consumer dependencies and the gate asserts EXACTLY that set: a
      # named absence is the expected state and warns, an absence nobody named still fails. It exists
      # so that a dependency npm refuses for a reason no caller can fix does not red that caller's
      # gate, because a permanently red gate is one people learn to ignore: the same failure as a
      # step that never runs.
      #
      # EMPTY BY DEFAULT SINCE 2026-11-08. It defaulted to `@cosyte/fhir=blocked` while npm refused
      # `@cosyte/fhir` (FHIR-NPM-NAME), so that `transform` and `synth` did not red on it. That
      # package is on the registry now, and the entry did what this allowance is built to do: it went
      # stale, and every caller's gate printed a notice saying so. A caller that names a new blocked
      # dependency passes it here; a caller that passes nothing names nothing, and any absence fails.
      #
      # THE `=blocked` TAG IS LOAD-BEARING, AND IT IS THE ONLY KIND THAT EXCUSES ANYTHING.
      # `@cosyte/assets` and `@cosyte/docs` are `E404` exactly like `@cosyte/fhir` was, and they are
      # `private: true` by design. A deliberate absence and an unexplained block must not share
      # words, so `=private` names the first and excuses nothing, in either gate: a package that
      # publishes must not depend on one that never will. Untagged is accepted and read as `blocked`,
      # which is the spelling `release.yml` shipped with, and is reported so it can be tightened.
      expect-unpublished-deps:
        description: "Known-absent consumer deps, comma separated, e.g. \"@scope/a=blocked\". Empty names none."
        type: string
        default: ""
      # THE DOCS-CONTENT GATE. OFF BY DEFAULT, AND THAT DEFAULT IS LOAD-BEARING: every caller tracks
      # `@main` and picks this up the moment it lands, so it must change nothing for any of the
      # thirteen until that caller opts in BY NAME. A repo that publishes `docs-content/` can today
      # merge and release content that breaks docs.cosyte.com, because nothing between the author and
      # the published site resolves the links in it: `x12`'s pull request checks were green while
      # `cosyte/docs` stayed red for eight days on a link `x12`'s own docs-content introduced.
      # Turning this on validates, in the pull request that introduces it, that every
      # PACKAGE-INTERNAL link and image under `docs-content/` and every document id
      # `docs-content/sidebars.json` names resolves. It requires that exact JSON spelling:
      # `sidebars.js`/`.ts` cannot be read without executing caller code. See the README's
      # "The docs-content gate" for what it does NOT claim.
      check-docs-content:
        description: "Resolve docs-content/ links, images and sidebar ids (needs docs-content/sidebars.json)."
        type: boolean
        default: false
      # THE DIRECTORY HOLDING THE PACKAGE, for every job but `prepublish` and `actionlint`. It exists so
      # `self-check.yml` can run this workflow against the fixture under `test/`, since this
      # repository is not a package itself. `prepublish` and `actionlint` do not read it: they read
      # the repository root, so a caller that moves it off "." turns `prepublish` off too. At "." every
      # step runs exactly as it did before the input existed.
      working-directory:
        description: "The directory holding package.json, relative to the repository root. Not read by prepublish or actionlint."
        type: string
        default: "."
      # THE TEST SUITE UNDER BUN, in its own job, `bun`, on ubuntu-latest. OFF BY DEFAULT, so no caller
      # changes until it opts in by name. The job installs with pnpm from the committed lockfile, as
      # `verify` does, then runs `bun --bun run test`: the caller's own `test` script, with every
      # `node` it starts (a bin's `#!/usr/bin/env node`, a literal `node`) run by Bun instead.
      run-bun:
        description: "Run the test script under Bun, in the bun job."
        type: boolean
        default: false
      bun-version:
        description: "The Bun version the bun job installs."
        type: string
        default: "1.4.4"
      # THE TEST SUITE UNDER DENO, in its own job, `deno`, on ubuntu-latest. OFF BY DEFAULT, for the
      # same reason. The job installs with pnpm, then runs `deno task test` with no `node` on PATH:
      # Deno's task runner runs a script's literal `node` with the real Node whenever one is on PATH,
      # and with Deno only when none is, so the step takes Node off PATH and refuses to run the suite
      # if a `node` is still reachable.
      run-deno:
        description: "Run the test script under Deno, in the deno job."
        type: boolean
        default: false
      deno-version:
        description: "The Deno version the deno job installs."
        type: string
        default: "2.9.8"
      # THE TESTING STANDARD'S TWO PULL REQUEST JOBS, each OFF BY DEFAULT behind its own input, so no
      # caller changes until it opts in by name. The standard is cosyte/config's
      # documentation/decisions/0004-the-testing-standard.md; the tools are `cosyte-ratchet` from
      # `@cosyte/script-utils` and `cosyte-mutate` from `@cosyte/vitest-config`, which a caller adds
      # to its own devDependencies, and the floor file is `quality-floor.json` beside `package.json`.
      #
      # `coverage-ratchet` runs the caller's `test:coverage` and then holds coverage to the floor
      # file: on a pull request against the base branch too, so every changed line coverage counts
      # must have run and no floor may be lowered or removed; on any other event against the floor
      # file alone.
      run-coverage-ratchet:
        description: "Hold coverage to quality-floor.json with cosyte-ratchet, in the coverage-ratchet job."
        type: boolean
        default: false
      # `mutation` runs on a pull request only: it mutates the source files the change touched and
      # requires every mutant in the changed lines to be killed. Both jobs run beside `verify`, never
      # after it, so a pull request waits for the slowest of them rather than for their sum.
      run-mutation:
        description: "On a pull request, mutate the changed files and judge their mutants, in the mutation job."
        type: boolean
        default: false
      # THE PERFORMANCE STANDARD'S TWO PULL REQUEST JOBS, each OFF BY DEFAULT behind its own input, so
      # no caller changes until it opts in by name. The standard is cosyte/config's
      # documentation/decisions/0005-the-performance-standard.md; the tools are the scaling gate in
      # `@cosyte/test-utils/perf` and `cosyte-bench` from `@cosyte/bench`, which a caller adds to its
      # own devDependencies.
      #
      # `scaling-gate` runs the caller's `test:perf`, the non-instrumented run that holds the scaling
      # gate and its self-check. It is the standard's required check for complexity regressions.
      run-scaling-gate:
        description: "Run the test:perf script, the scaling gate from @cosyte/test-utils/perf, in the scaling-gate job."
        type: boolean
        default: false
      # `bench-compare` runs on a pull request only: it builds the base beside the head and times both,
      # interleaved, on one runner, with `cosyte-bench compare`. IT IS ADVISORY AND NEVER FAILS: it
      # posts its numbers in the job summary and keeps the results as an artifact, and stays that way
      # until an A/A calibration of the caller's suite on this runner class shows false alarms under
      # 1% (the standard's section 4). A regression is a warning on the run's page, not a red check.
      run-bench-compare:
        description: "On a pull request, time the base build against the head build with @cosyte/bench, in the bench-compare job. Advisory: it never fails."
        type: boolean
        default: false
      bench-suites:
        description: "The suites bench-compare runs, separated by spaces or new lines, relative to working-directory. Empty runs every bench/*.bench.mjs and bench/*.bench.ts."
        type: string
        default: ""
      bench-target:
        description: "The built entry bench-compare times on each side, relative to working-directory."
        type: string
        default: "dist/index.mjs"

permissions:
  contents: read

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        node: ${{ fromJSON(inputs.node-versions) }}
        os: ${{ fromJSON(inputs.os) }}
    runs-on: ${{ matrix.os }}
    # A caller cannot bound a job that calls this workflow, so the bound is here: about seven times
    # the slowest leg measured on 2026-11-07 (4 minutes, hl7 on Node 24).
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # LF LINE ENDINGS ON EVERY SYSTEM, SET BEFORE THE CHECKOUT, SO THE RUNNER IMAGE DOES NOT DECIDE.
      # Git on `windows-latest` checks text files out with CRLF: on 2026-11-10 (image
      # windows-2025-vs2026, git 2.56.0.windows.4) every file of the fixture under
      # `test/fixtures/ci-caller/`, whose eol is left unspecified, came out CRLF, and its
      # `format:check` failed on all eleven. A caller whose `.gitattributes` says `eol=lf` never saw
      # it, because an eol attribute overrides both settings below; a caller without one would have
      # seen its formatter and its tests read different bytes on Windows than on Linux. These two
      # make a file with no eol attribute come out as committed, LF for text, on every system, and
      # leave a file whose eol the repository sets to that setting. No `if:`, so all three systems
      # run the same step; in the workspace, because the directory `working-directory` names does
      # not exist before the checkout.
      - name: Check out text files with LF line endings
        shell: bash
        working-directory: .
        run: |
          git config --global core.autocrlf false
          git config --global core.eol lf
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # At the default "." these two read exactly what they read before `working-directory` existed:
      # `package.json` is the action's own default, and an empty `cache-dependency-path` is unset.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory == '.' && 'package.json' || format('{0}/package.json', inputs.working-directory) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ matrix.node }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/pnpm-lock.yaml', inputs.working-directory) || '' }}
      # THE DOCS-CONTENT GATE RUNS HERE, IN `verify`, AS TWO STEPS, AND EVERY PART OF THAT IS
      # DELIBERATE.
      #
      # IN AN EXISTING JOB, so it adds no status check context. This repository cannot edit any
      # caller's branch protection, so a failure in a NEW context would leave a caller's required set
      # green; failing inside an EXISTING one binds every repo already requiring today's contexts.
      # `verify` specifically because it is the only job here with NO job-level `if:` and no
      # `needs:`: a job skipped by a conditional SATISFIES its required context (see the README), so
      # hanging this off `prepublish` or `actionlint` would report success having never run.
      #
      # BEFORE THE INSTALL, for the reason the prepublish manifest lint states below: this reads a
      # directory, needs no network, no dependency and no install, and a finding is deterministic and
      # never excusable, so there is nothing to be gained by spending an install before saying so.
      #
      # DELIVERED OUTSIDE `GITHUB_WORKSPACE`. `actions/checkout` refuses a path outside the
      # workspace, and a second tree INSIDE it is visible to `pnpm lint`, `pnpm format:check` and
      # `pnpm phi-scan`, whose scanner walks from the repo root. So the checker is fetched into
      # `RUNNER_TEMP` instead, unauthenticated (this repository is public), at `job.workflow_sha`
      # rather than `main`: the code that runs must belong to the version of this workflow the
      # caller resolved, not to whatever `main` holds mid-run. It is ONE self-contained file
      # importing `node:*` only, asserted in `test/docs-content-check.test.mjs`, because an entry
      # point importing a sibling under `scripts/` would pass every test there and die
      # `ERR_MODULE_NOT_FOUND` here.
      #
      # THE REF IS `job.workflow_sha`, AND THE EXPRESSION THAT USED TO BE HERE RESOLVED TO THE EMPTY
      # STRING. This step shipped as `TOOLING_SHA: ${{ github.job_workflow_sha }}`, which is not a
      # property of the `github` context: the contexts reference gives that context
      # `github.workflow_sha` and `github.workflow_ref`, both of which describe the CALLER's
      # workflow file, and puts the identity of the file that defines a CALLED job on the `job`
      # context instead (`job.workflow_sha`, `job.workflow_repository`, `job.workflow_ref`,
      # `job.workflow_file_path`). Its own reusable-workflow example checks a workflow's own source
      # out with that pair. An unknown property is not an expression error, it is `''`, so the URL
      # degenerated to `.../cosyte/.github//scripts/docs-content-check.mjs` and the first opted-in
      # caller's `verify` died on `curl: (22) ... 404` BEFORE the checker started, on both matrix
      # legs and again on a re-run (`cosyte/x12` run 33230794979). The gate emitted no verdict at
      # all: not a pass, not a finding. `job` is available in `steps.env`, `steps.run` and
      # `steps.with`, which is what lets it be read here and in `prepublish` below.
      #
      # AND THE STEP SAYS WHICH REF IT USED, EVERY TIME, because the failure above was silent about
      # the one fact that explained it. The ref is echoed with the URL before the fetch; an empty
      # one is ANNOUNCED and falls back to the default branch rather than building a URL nobody can
      # read; and every delivery failure prints the ref and the location it tried, so a caller is
      # never handed a bare `curl: (22)` as the whole explanation. The fallback is not a swallowed
      # failure: the checker is still fetched, still run, and the step that runs it still decides
      # the job. It is also not a new behaviour, it is the one the empty value already produced in
      # `prepublish` below, said out loud.
      #
      # `shell: bash` ON BOTH, because the `os` axis is caller-supplied and may be widened to
      # `windows-latest`, where the default shell is `pwsh`, `$RUNNER_TEMP` expands to nothing and
      # the fetch would land nowhere while the identical ubuntu cell went green: two verdicts for one
      # tree. `set -euo pipefail` and the `test -s` are what make a FAILED DELIVERY red the job
      # rather than read as zero findings, and there is deliberately no `|| true`, no
      # `continue-on-error` and no tee-and-exit-zero anywhere here: printing findings into the log
      # while the job stays green reproduces the incident this gate exists to stop, through a fully
      # compliant pull request.
      - name: Fetch the docs-content checker
        if: ${{ inputs.check-docs-content }}
        shell: bash
        env:
          TOOLING_SHA: ${{ job.workflow_sha }}
        run: |
          set -euo pipefail
          ref="${TOOLING_SHA}"
          if [ -z "${ref}" ]; then
            echo "docs-content delivery: job.workflow_sha was empty, falling back to main" >&2
            ref=main
          fi
          url="https://raw.githubusercontent.com/cosyte/.github/${ref}/scripts/docs-content-check.mjs"
          echo "docs-content delivery: ref ${ref}, from ${url}"
          if ! curl --fail --silent --show-error --location "${url}" \
            --output "${RUNNER_TEMP}/docs-content-check.mjs"; then
            echo "docs-content delivery FAILED at ref ${ref}: could not download ${url}" >&2
            exit 1
          fi
          if ! test -s "${RUNNER_TEMP}/docs-content-check.mjs"; then
            echo "docs-content delivery FAILED at ref ${ref}: ${url} left ${RUNNER_TEMP}/docs-content-check.mjs empty" >&2
            exit 1
          fi
          if ! node --check "${RUNNER_TEMP}/docs-content-check.mjs"; then
            echo "docs-content delivery FAILED at ref ${ref}: what ${url} put in ${RUNNER_TEMP}/docs-content-check.mjs is not the checker" >&2
            exit 1
          fi
      - name: docs-content links, images and sidebar ids must resolve
        if: ${{ inputs.check-docs-content }}
        shell: bash
        run: |
          set -euo pipefail
          node "${RUNNER_TEMP}/docs-content-check.mjs" --repo .
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm lint
      - run: pnpm format:check
      - if: ${{ inputs.run-phi-scan }}
        run: pnpm phi-scan
      - run: pnpm test
      - run: pnpm test:coverage
      - run: pnpm build
      - run: pnpm attw
      - name: Dual ESM/CJS smoke
        shell: bash
        run: |
          test -f dist/index.mjs && test -f dist/index.cjs && test -f dist/index.d.ts
          node -e "import('file://' + process.cwd() + '/dist/index.mjs').then(() => console.log('esm ok'))"
          node -e "require('./dist/index.cjs'); console.log('cjs ok')"

  # THE TWO PRE-PUBLISH LAYERS, IN THEIR OWN JOB RATHER THAN AS STEPS IN `verify`, AND THE REASON IS
  # NOT TIDINESS. This needs a checkout of `cosyte/.github` for the script, `actions/checkout`
  # refuses a path outside `GITHUB_WORKSPACE`, and a second tree inside the caller's workspace is
  # visible to `pnpm lint`, `pnpm format:check` and `pnpm phi-scan`. `ccda`'s PHI scanner walks from
  # the REPO ROOT. Putting it in `verify` would have this gate seeding files inside another gate's
  # scan roots, which is the enumerate-then-read hazard that has already cost this org a blocked
  # publish. Its own job has its own workspace and touches none of them.
  prepublish:
    if: ${{ inputs.run-prepublish-manifest-lint || inputs.run-prepublish-install }}
    runs-on: ubuntu-latest
    # A caller cannot bound a job that calls this workflow, so the bound is here, above the install
    # step's own 15 minutes.
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # `job.workflow_sha` rather than `main`: the script must be the one that belongs to the
      # version of this workflow the caller resolved, even though every caller pins `@main`.
      #
      # THIS IS THE SAME RESOLUTION THE DOCS-CONTENT DELIVERY USES, AND IT IS THE SECOND HALF OF THE
      # SAME DEFECT. This `ref:` read `${{ github.job_workflow_sha }}` too, and that expression is
      # `''` for the same reason it was empty there. An empty `ref:` is not an error for
      # `actions/checkout`: it resolves the repository's DEFAULT BRANCH. So the identical empty
      # value was fatal in the raw-URL delivery above and silent here, where it quietly contradicted
      # the sentence directly above it for every one of the thirteen callers, in a job that is ON BY
      # DEFAULT. Nothing was ever red, and nothing said so. Both sites now read the one property the
      # contexts reference defines for this, and an empty value here degrades to exactly the default
      # branch it has been resolving all along.
      - name: Check out the shared CI tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cosyte/.github
          ref: ${{ job.workflow_sha }}
          path: .cosyte-ci-tooling
          persist-credentials: false
      # THE LOWEST NODE LINE THE CALLER TESTS, read from its own `node-versions`, so the tarball is
      # installed on the oldest Node the package claims to support. A fixed "22" refused every caller
      # whose `engines.node` starts above 22: pnpm's engine-strict install fails before any check
      # runs. Callers list `node-versions` lowest first, and the default's first entry is "22", so
      # every caller that tested 22 still installs on 22.
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
      # FIRST, AND BEFORE ANY INSTALL. It reads one JSON file, needs no network and no dependencies,
      # and a finding here is deterministic and never excusable, so there is nothing to be gained by
      # spending an install before saying so.
      - name: Every dependency specifier must resolve from a registry
        if: ${{ inputs.run-prepublish-manifest-lint }}
        env:
          EXPECT_UNPUBLISHED_DEPS: ${{ inputs.expect-unpublished-deps }}
        shell: bash
        run: |
          node .cosyte-ci-tooling/scripts/prepublish-check.mjs manifest \
            --repo . --expect-unpublished-deps "$EXPECT_UNPUBLISHED_DEPS"
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        if: ${{ inputs.run-prepublish-install }}
      - if: ${{ inputs.run-prepublish-install }}
        run: pnpm install --frozen-lockfile
      # The tarball has to contain a real build or the probe measures nothing. `prepublish-check.mjs`
      # distinguishes "the tree was never built" from "the manifest's `files` drops something", so a
      # mistake in THIS ordering does not get reported as a packaging defect in the caller.
      - if: ${{ inputs.run-prepublish-install }}
        run: pnpm build
      # The outer bound. The script's own inner bounds are smaller (30s per registry fetch, 180s per
      # npm invocation), so reaching this one is a bug rather than a slow registry.
      - name: The packed tarball must install into a clean directory
        if: ${{ inputs.run-prepublish-install }}
        timeout-minutes: 15
        env:
          EXPECT_UNPUBLISHED_DEPS: ${{ inputs.expect-unpublished-deps }}
        shell: bash
        run: |
          node .cosyte-ci-tooling/scripts/prepublish-check.mjs pack \
            --repo . --expect-unpublished-deps "$EXPECT_UNPUBLISHED_DEPS"

  # ACTIONLINT IS rhysd/actionlint'S OWN RELEASE BINARY, AT ONE VERSION AND ONE SHA-256, not
  # reviewdog/action-actionlint. From v1.75.0 that action installs actionlint by piping a download
  # script from a fork (kjanat/actionlint) into bash, so a bump of its pin would run code from outside
  # the actionlint project in every caller's CI. Here the official release asset is downloaded at the
  # version below and checked against the SHA-256 below before it is unpacked, so a changed asset
  # fails the job. Moving to a new version means changing both values together, here and in
  # `self-check.yml`; `test/actionlint-pinned.test.mjs` holds the two files to the same pair.
  #
  # THE JOB ID, `actionlint`, AND THE `run-actionlint` INPUT ARE UNCHANGED, so a caller's ruleset
  # entry for `<caller job id> / actionlint` still names this job. What changed is what fails it:
  # actionlint's own exit status, over every tracked workflow file, where the action reported only
  # findings on lines a pull request changed. Every caller was measured clean that way before this
  # landed. shellcheck is preinstalled on the hosted runner, and actionlint silently skips its shell
  # checks without it, so the install step refuses to continue when it is missing.
  #
  # THE TARBALL IS CACHED IN THE CALLER'S OWN ACTIONS CACHE, keyed on the version and the SHA-256, so
  # a release-download outage fails only a run that has no cached copy. The cache steps use the
  # runner's own cache token, so a caller grants no permission for them and passes no input.
  actionlint:
    if: ${{ inputs.run-actionlint }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # THE RELEASE TARBALL IS CACHED, keyed on the version and the SHA-256, so a run that finds it
      # never asks GitHub's release downloads, which answered 504 for hours on 2026-11-08 and failed
      # this job everywhere. The cache is only where the bytes come from: the install step checks the
      # SHA-256 of whatever it unpacks, cached or downloaded, so a cache entry is trusted no further
      # than a download. A cache that cannot be reached is a miss with a warning, never a failure.
      - name: Restore the actionlint release from the cache
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint-cache
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-linux-amd64-${{ env.ACTIONLINT_SHA256 }}
      # A cached tarball whose hash matches is unpacked as it is. Anything else (no cached copy, or
      # one that does not match) is downloaded, with bounded retries and curl's own backoff, and the
      # download is checked against the same SHA-256 before it is unpacked.
      - name: Install actionlint at the pinned version and checksum
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cache_dir="${RUNNER_TEMP}/actionlint-cache"
          if [ -f "${cache_dir}/${tarball}" ] \
            && echo "${ACTIONLINT_SHA256}  ${cache_dir}/${tarball}" | sha256sum -c --status -; then
            echo "actionlint ${ACTIONLINT_VERSION}: the cached release matches the pinned SHA-256."
          else
            if [ -f "${cache_dir}/${tarball}" ]; then
              echo "::warning::the cached actionlint release does not match the pinned SHA-256, so it is downloaded again"
            fi
            mkdir -p "${cache_dir}"
            curl -fsSL --retry 5 --retry-connrefused --retry-max-time 120 --connect-timeout 20 \
              -o "${cache_dir}/${tarball}" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          fi
          echo "${ACTIONLINT_SHA256}  ${cache_dir}/${tarball}" | sha256sum -c -
          tar -xzf "${cache_dir}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" --version
          shellcheck --version
      # Saved straight after the checked install and before the lint, so a pull request whose lint
      # finds something still seeds the cache. Only on a miss: an entry is never rewritten, and a
      # failed save is a warning. This step runs only after the install step passed, so what it
      # saves is a tarball whose SHA-256 was just checked.
      - name: Save the actionlint release to the cache
        if: ${{ steps.actionlint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint-cache
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}
      - name: actionlint over .github/workflows/
        shell: bash
        run: |
          set -euo pipefail
          listed="$(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')"
          if [ -z "${listed}" ]; then
            echo "::error::no workflow file found under .github/workflows/"
            exit 1
          fi
          mapfile -t files <<< "${listed}"
          "${RUNNER_TEMP}/actionlint" -color "${files[@]}"
          echo "actionlint clean over ${#files[@]} workflow file(s)."

  # THE TEST SUITE UNDER BUN AND UNDER DENO, each in its own job, `bun` and `deno`, each OFF BY
  # DEFAULT behind its own input, so a caller that passes nothing gets two skipped jobs and no other
  # change. Each installs exactly what `verify` installs, with pnpm from the committed lockfile, and
  # then runs the caller's own `test` script under the other runtime. Both run on ubuntu-latest only:
  # the system matrix is `verify`'s, and one system per runtime keeps each job id a single, stable
  # check context, `<caller job id> / bun` and `<caller job id> / deno`.
  #
  # A SKIPPED JOB SATISFIES A REQUIRED CONTEXT, so a caller that requires `ci / bun` and later turns
  # `run-bun` off keeps a green merge button over a context that ran nothing (README.md, "What a
  # skipped required context does to a merge"). Require these only while the input is on.
  bun:
    if: ${{ inputs.run-bun }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory == '.' && 'package.json' || format('{0}/package.json', inputs.working-directory) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/pnpm-lock.yaml', inputs.working-directory) || '' }}
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version: ${{ inputs.bun-version }}
      - run: pnpm install --frozen-lockfile
      # `--bun` is what puts the suite on Bun: without it, `bun run` starts a script's
      # `#!/usr/bin/env node` bins (vitest, tsx, a `cosyte-process` verb) with Node. Measured on
      # 2026-11-10 with a test that throws `process.versions`: with `--bun` the vitest workers report
      # Bun, and without it they report Node.
      - name: The test suite under Bun
        shell: bash
        run: |
          set -euo pipefail
          echo "bun: $(bun --version)"
          bun --bun run test

  deno:
    if: ${{ inputs.run-deno }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory == '.' && 'package.json' || format('{0}/package.json', inputs.working-directory) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/pnpm-lock.yaml', inputs.working-directory) || '' }}
      - uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed # v2.0.5
        with:
          deno-version: ${{ inputs.deno-version }}
      - run: pnpm install --frozen-lockfile
      # NODE COMES OFF PATH FIRST. `deno task` runs a package bin with Deno, but runs a script's
      # literal `node` with the real Node whenever one is on PATH, and with Deno only when none is:
      # measured on 2026-11-10, `node tool.mjs test` reported Node with Node on PATH and Deno without
      # it. So every PATH entry holding a `node` is replaced by a directory of links to everything
      # else in it, and the step refuses to run the suite while any `node` is still reachable.
      - name: The test suite under Deno
        shell: bash
        run: |
          set -euo pipefail
          shadow="${RUNNER_TEMP}/path-without-node"
          rm -rf "${shadow}"
          kept=()
          count=0
          IFS=':' read -r -a entries <<< "${PATH}"
          for entry in "${entries[@]}"; do
            if [ -n "${entry}" ] && [ -e "${entry}/node" ]; then
              count=$((count + 1))
              mirror="${shadow}/${count}"
              mkdir -p "${mirror}"
              for tool in "${entry}"/*; do
                if [ "${tool##*/}" != node ]; then ln -s "${tool}" "${mirror}/"; fi
              done
              echo "deno: ${entry} holds a node, so PATH names ${mirror} in its place, with everything else in it"
              entry="${mirror}"
            fi
            kept+=("${entry}")
          done
          PATH="$(IFS=':'; echo "${kept[*]}")"
          if found="$(command -v node)"; then
            echo "::error::a node is still on PATH at ${found}, so the suite would run under Node rather than Deno"
            exit 1
          fi
          echo "deno: $(deno --version | head -n 1)"
          deno task test

  # THE TESTING STANDARD ON A PULL REQUEST, in two jobs, `coverage-ratchet` and `mutation`, each OFF
  # BY DEFAULT behind its own input, so a caller that passes nothing gets two skipped jobs and no
  # other change. Each runs on ubuntu-latest at the lowest Node line, so a floor is judged on one
  # system and one Node and each job id is one stable check context: `<caller job id> /
  # coverage-ratchet` and `<caller job id> / mutation`. Neither has a `needs:`, so both run beside
  # `verify` and the slowest of the three sets how long a pull request waits.
  #
  # A SKIPPED JOB SATISFIES A REQUIRED CONTEXT. `mutation` is skipped on every event but a pull
  # request, and both are skipped while their input is off, so require either one only while its
  # input is on (README.md, "What a skipped required context does to a merge").
  #
  # The checkout fetches the whole history: the ratchet and the changed-files run both diff against
  # the merge base of the base branch and HEAD, and a shallow clone has no merge base. Each judging
  # step writes the ratchet's own report to the job summary, so the exceptions it lists for the
  # changed code are on the run's page for the pull request to carry.
  coverage-ratchet:
    if: ${{ inputs.run-coverage-ratchet }}
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory == '.' && 'package.json' || format('{0}/package.json', inputs.working-directory) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/pnpm-lock.yaml', inputs.working-directory) || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:coverage
      # `--skip mutation`: the mutants are judged in the `mutation` job. On a pull request
      # `github.base_ref` names the base branch; on a push it is empty and the ratchet compares the
      # measurements with the floor file as it stands.
      - name: The coverage ratchet
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          args=(check --skip mutation)
          if [ -n "${BASE_REF}" ]; then args+=(--base "origin/${BASE_REF}"); fi
          report="${RUNNER_TEMP}/coverage-ratchet.txt"
          status=0
          pnpm exec cosyte-ratchet "${args[@]}" > "${report}" 2>&1 || status=$?
          cat "${report}"
          {
            echo "### Coverage against the floor"
            echo
            echo '```text'
            cat "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"

  mutation:
    if: ${{ inputs.run-mutation && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # A large changed file is mutated whole: the PHI-scan engine took 10 to 13 minutes on 16 cores
    # (cosyte/config, decision 0004). The bound is the job's; the 15 minute budget for a pull request
    # is the caller's to watch.
    timeout-minutes: 60
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory == '.' && 'package.json' || format('{0}/package.json', inputs.working-directory) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/pnpm-lock.yaml', inputs.working-directory) || '' }}
      - run: pnpm install --frozen-lockfile
      # A change with no changed source file starts no mutation run: `cosyte-mutate` writes an empty
      # report and exits 0, so the ratchet can tell "ran, nothing to mutate" from "never ran". An
      # empty base is refused rather than read as "nothing changed".
      - name: Mutate the changed files
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ]; then
            echo "::error::the mutation job judges a pull request's changed files, and this run has no base branch"
            exit 1
          fi
          pnpm exec cosyte-mutate changed --base "origin/${BASE_REF}"
      # `--skip coverage`: coverage is judged in the `coverage-ratchet` job.
      - name: The mutation ratchet over the changed code
        shell: bash
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -z "${BASE_REF}" ]; then
            echo "::error::the mutation job judges a pull request's changed files, and this run has no base branch"
            exit 1
          fi
          report="${RUNNER_TEMP}/mutation-ratchet.txt"
          status=0
          pnpm exec cosyte-ratchet check --skip coverage --base "origin/${BASE_REF}" > "${report}" 2>&1 || status=$?
          cat "${report}"
          {
            echo "### Mutants in the changed code"
            echo
            echo '```text'
            cat "${report}"
            echo '```'
          } >> "${GITHUB_STEP_SUMMARY}"
          exit "${status}"
      # The JSON and HTML reports, so a reviewer can read each surviving mutant. `!cancelled()` keeps
      # them when a step above failed, which is when they are read; the job's verdict is still the
      # failed step's.
      - name: Keep the mutation report
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-changed
          path: ${{ inputs.working-directory }}/reports/mutation/
          if-no-files-found: warn
          retention-days: 14

  # THE PERFORMANCE STANDARD ON A PULL REQUEST, in two jobs, `scaling-gate` and `bench-compare`,
  # each OFF BY DEFAULT behind its own input, so a caller that passes nothing gets two skipped jobs
  # and no other change. Each runs on ubuntu-latest at the lowest Node line, so each job id is one
  # stable check context, `<caller job id> / scaling-gate` and `<caller job id> / bench-compare`, and
  # the runner class is the one the standard's calibration was taken on. Neither has a `needs:`, so
  # both run beside `verify` and the slowest job sets how long a pull request waits.
  #
  # A SKIPPED JOB SATISFIES A REQUIRED CONTEXT, so require `scaling-gate` only while its input is on
  # (README.md, "What a skipped required context does to a merge"). Never require `bench-compare`:
  # it ends green whatever it measured, by design, until the calibration rule is met.
  scaling-gate:
    if: ${{ inputs.run-scaling-gate }}
    runs-on: ubuntu-latest
    # The gate times each phase for well under a second and its self-check about as long again; the
    # bound is for an install and a suite that hang, inside the 15 minute budget for a pull request.
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory == '.' && 'package.json' || format('{0}/package.json', inputs.working-directory) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/pnpm-lock.yaml', inputs.working-directory) || '' }}
      - run: pnpm install --frozen-lockfile
      - run: pnpm test:perf

  bench-compare:
    if: ${{ inputs.run-bench-compare && github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    # The comparisons stop themselves at BENCH_BUDGET_SECONDS below and report it; this bound is for
    # an install or a build that hangs, which would otherwise hold a runner for the default six hours.
    timeout-minutes: 20
    defaults:
      run:
        working-directory: ${{ inputs.working-directory }}
    steps:
      # The whole history, so the base commit is on disk for a worktree beside the head.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: ${{ inputs.working-directory == '.' && 'package.json' || format('{0}/package.json', inputs.working-directory) }}
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: ${{ fromJSON(inputs.node-versions)[0] }}
          cache: pnpm
          cache-dependency-path: ${{ inputs.working-directory != '.' && format('{0}/pnpm-lock.yaml', inputs.working-directory) || '' }}
      # ONE STEP, AND IT ENDS 0 WHATEVER HAPPENS. The head is installed and built here, the base is
      # checked out in a worktree under RUNNER_TEMP and installed and built there, and each suite (the
      # head's, which is handed either build) runs `cosyte-bench compare`: 12 rounds, each running
      # every case once on each side in a fresh process, back to back, so the runner's noise lands on
      # both. The tool's exit (1 a regression, 2 a case it could not measure) becomes an annotation on
      # the run's page, never a red check; a base that does not build, a suite that is not there, or
      # a spent budget ends the step with a note. Each suite's results document (results-v1, checked
      # with `cosyte-bench check`) and its Markdown are kept in the `bench-comparison` artifact.
      - name: Compare the base build with the head build
        shell: bash
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          BENCH_SUITES: ${{ inputs.bench-suites }}
          BENCH_TARGET: ${{ inputs.bench-target }}
          BENCH_BUDGET_SECONDS: "600"
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/bench-comparison"
          mkdir -p "${out}"
          {
            echo "### Base against head timing (advisory)"
            echo
            echo "This comparison does not fail the pull request. It becomes a required check only once an A/A calibration of this suite on this runner class shows false alarms under 1% (cosyte/config, documentation/decisions/0005-the-performance-standard.md, section 4)."
          } >> "${GITHUB_STEP_SUMMARY}"
          stop() {
            echo "::warning::bench-compare: $1; nothing was compared, and the pull request is not failed for it"
            { echo; echo "Not run: $1."; } >> "${GITHUB_STEP_SUMMARY}"
            exit 0
          }
          if [ -z "${BASE_SHA}" ]; then stop "this run names no base commit"; fi
          suites=()
          if [ -n "${BENCH_SUITES//[[:space:]]/}" ]; then
            read -r -d '' -a suites <<< "${BENCH_SUITES}" || true
          else
            shopt -s nullglob
            suites=(bench/*.bench.mjs bench/*.bench.ts)
            shopt -u nullglob
          fi
          if [ "${#suites[@]}" -eq 0 ]; then stop "no suite to run: name one in bench-suites, or add bench/<name>.bench.mjs"; fi
          if ! pnpm install --frozen-lockfile || ! pnpm build; then stop "the head did not install or build"; fi
          head_sha="$(git rev-parse HEAD)"
          prefix="$(git rev-parse --show-prefix)"
          base_root="${RUNNER_TEMP}/bench-base"
          base_dir="${base_root}"
          if [ -n "${prefix}" ]; then base_dir="${base_root}/${prefix%/}"; fi
          if ! git worktree add --quiet --detach "${base_root}" "${BASE_SHA}"; then stop "the base commit ${BASE_SHA} could not be checked out"; fi
          if ! (cd "${base_dir}" && pnpm install --frozen-lockfile && pnpm build); then stop "the base did not install or build"; fi
          deadline=$((SECONDS + BENCH_BUDGET_SECONDS))
          for suite in "${suites[@]}"; do
            if [ ! -f "${suite}" ]; then
              echo "::warning::bench-compare: ${suite} is not a file, so it was not compared"
              continue
            fi
            name="${suite%.bench.*}"
            name="${name//\//-}"
            left=$((deadline - SECONDS))
            if [ "${left}" -le 0 ]; then
              echo "::warning::bench-compare: ${suite}: not compared, the ${BENCH_BUDGET_SECONDS} second budget was spent"
              { echo; echo "Not compared: ${suite}, the ${BENCH_BUDGET_SECONDS} second budget was spent."; } >> "${GITHUB_STEP_SUMMARY}"
              continue
            fi
            status=0
            timeout --kill-after=10 "${left}" pnpm exec cosyte-bench compare --suite "${suite}" \
              --base "${base_dir}/${BENCH_TARGET}" --head "${BENCH_TARGET}" \
              --base-commit "${BASE_SHA}" --head-commit "${head_sha}" \
              --out "${out}/${name}.json" --summary "${out}/${name}.md" || status=$?
            case "${status}" in
              0) ;;
              1) echo "::warning::bench-compare: ${suite}: the head is slower than the base beyond the threshold in at least one case. Advisory: this does not fail the pull request" ;;
              2) echo "::notice::bench-compare: ${suite}: could not measure every case (a skip, or a process that died), and a skip is not a pass" ;;
              124 | 137) echo "::warning::bench-compare: ${suite}: stopped at the end of the ${BENCH_BUDGET_SECONDS} second budget" ;;
              *) echo "::warning::bench-compare: ${suite}: cosyte-bench exited ${status}" ;;
            esac
            if [ -f "${out}/${name}.md" ]; then
              { echo; cat "${out}/${name}.md"; } >> "${GITHUB_STEP_SUMMARY}"
            else
              { echo; echo "No results for ${suite}: cosyte-bench exited ${status}."; } >> "${GITHUB_STEP_SUMMARY}"
            fi
            if [ -f "${out}/${name}.json" ] && ! pnpm exec cosyte-bench check "${out}/${name}.json"; then
              echo "::warning::bench-compare: ${out}/${name}.json does not match the results schema"
            fi
          done
          exit 0
      # The results documents, in the results-v1 shape `@cosyte/bench` writes, and their Markdown.
      # `!cancelled()` keeps whatever was written before a timeout or a failed setup step.
      - name: Keep the comparison
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: bench-comparison
          path: ${{ runner.temp }}/bench-comparison/
          if-no-files-found: warn
          retention-days: 30
