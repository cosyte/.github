name: Drift check

# Reusable drift check, called from the meta-repo (umbrella). Fails when any @cosyte/* parser repo
# diverges from the canonical baseline encoded in config/drift-manifest.json.
# Caller (umbrella .github/workflows/drift-check.yml):
#   on: { push: { branches: [main] }, pull_request: { branches: [main] } }
#   jobs:
#     drift:
#       uses: cosyte/.github/.github/workflows/drift-check.yml@workflows-YYYY-MM-DD-COMMIT
# The checker is zero-dep (Node stdlib), so no install is needed, only the submodules checked out.
#
# ▶ NAME A PUBLISHED REFERENCE, NOT `@main`. A reference at the default branch delivers every later
#   change made here on THIS repository's clock rather than yours, reviewed by nobody in your
#   repository; a published reference names one commit and never moves. Take the newest from
#   https://github.com/cosyte/.github/releases, whose notes say what adopting it asks of a caller.
#   README.md, "The published reference", owns the rest.

on:
  workflow_call:
    inputs:
      node-version:
        type: string
        default: "22"

permissions:
  contents: read

jobs:
  drift:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true # top-level only (never recursive)
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
      - name: Check for drift
        run: node config/scripts/drift-check.js
