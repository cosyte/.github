name: Probe reusable

# TEMPORARY MEASUREMENT ARTIFACT. It exists to settle SKIPPED-REQUIRED-CONTEXT-UNSETTLED with a live
# run and is deleted from the branch before the pull request merges. It ships nothing.
#
# This is `ci.yml`'s exact shape: a job inside a `workflow_call` workflow, behind a job-level `if:`
# reading a boolean input, invoked by a caller job. The caller job id plus this job id is the
# check-run context, the same way `ci / actionlint` is composed in the thirteen callers.

on:
  workflow_call:
    inputs:
      run-probe:
        description: "Mirrors ci.yml's run-actionlint. False makes the job below skip."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  probe-inner:
    if: ${{ inputs.run-probe }}
    runs-on: ubuntu-latest
    steps:
      - name: This step never runs when the input is false
        run: echo "probe-inner ran"
