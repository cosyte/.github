name: Scorecard

# Reusable OpenSSF Scorecard supply-chain analysis for @cosyte/* public repos.
# Caller (each repo's .github/workflows/scorecard.yml):
#   jobs:
#     scorecard:
#       permissions:
#         contents: read         # REQUIRED, because the caller job reads this reusable to resolve it;
#                                # omit it and the job gets contents:none and startup-fails.
#         security-events: write # upload the SARIF to the repo's Security tab
#         id-token: write        # publish results to the OpenSSF API (for the badge)
#       uses: cosyte/.github/.github/workflows/scorecard.yml@workflows-YYYY-MM-DD-COMMIT
# A called workflow can only downgrade the caller's token, so the caller MUST grant these. Runs on a
# weekly schedule + push to main (set by the caller's `on:`); never on pull_request (publish needs the
# default branch). Actions pinned to SHAs.
#
# ▶ NAME A PUBLISHED REFERENCE, NOT `@main`. A reference at the default branch delivers every later
#   change made here on THIS repository's clock rather than yours, reviewed by nobody in your
#   repository; a published reference names one commit and never moves. Take the newest from
#   https://github.com/cosyte/.github/releases, whose notes say what adopting it asks of a caller.
#   README.md, "The published reference", owns the rest.

on:
  workflow_call:
    inputs:
      publish-results:
        description: "Publish results to the OpenSSF REST API (required for the badge)."
        type: boolean
        default: true

permissions:
  contents: read

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
      id-token: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Run analysis
        uses: ossf/scorecard-action@4eaacf0543bb3f2c246792bd56e8cdeffafb205a # v2.4.3
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: ${{ inputs.publish-results }}
      - name: Upload artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: SARIF file
          path: results.sarif
          retention-days: 5
      # Same SHA as codeql.yml's `init`/`analyze`, deliberately. See the invariant recorded there:
      # every `github/codeql-action/*` pin in this repo moves together, in one commit, and Dependabot
      # cannot produce that change because it opens one PR per action path. This one is safe ALONE
      # (no `init` in this workflow, and `upload-sarif` never loads an init config), but it is kept
      # in step so "one SHA, repo-wide" stays a thing a reader can check by eye.
      - name: Upload SARIF to code-scanning
        uses: github/codeql-action/upload-sarif@5595ccaf912efad79be6eef63a5619ff05969be3 # v4.37.6
        with:
          sarif_file: results.sarif
