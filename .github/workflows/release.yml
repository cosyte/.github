name: Release

# Reusable release for @cosyte/* packages.
# Caller (each repo's .github/workflows/release.yml):
#   jobs:
#     release:
#       uses: cosyte/.github/.github/workflows/release.yml@workflows-YYYY-MM-DD-COMMIT
#       with: { package-name: "@cosyte/hl7" }
#       secrets: inherit
#       permissions:          # see THE CALLER-SIDE PRECONDITION below
#         actions: read
#         contents: write
#         id-token: write
#         pull-requests: write
#
# ▶ NAME A PUBLISHED REFERENCE, NOT `@main`. A reference at the default branch delivers every later
#   change made here on THIS repository's clock rather than yours, reviewed by nobody in your
#   repository; a published reference names one commit and never moves. Take the newest from
#   https://github.com/cosyte/.github/releases, whose notes say what adopting it asks of a caller.
#   README.md, "The published reference", owns the rest.
#
# ▶ THE CALLER-SIDE PRECONDITION, AND IT IS A PREREQUISITE RATHER THAN A RECOMMENDATION. READ THIS
#   BEFORE ADOPTING A NEW VERSION OF THIS FILE.
#
#   This workflow now declares `actions: read`, which is what the release-environment gate below
#   reads a caller's environment protection with. "The `GITHUB_TOKEN` permissions passed from the
#   caller workflow can be only downgraded (not elevated) by the called workflow." A calling job that
#   pins a `permissions:` block granting contents/id-token/pull-requests and nothing else is granting
#   `actions: none`, and a request for `actions: read` against that is an ELEVATION: GitHub refuses
#   the whole workflow at STARTUP, before any job or step runs, so the gate never speaks and no
#   refusal is printed. A calling job that sets NO `permissions:` block inherits the repository
#   default instead, and the same elevation applies whenever that default is the restricted one
#   ("just read access for the `contents` and `packages` permissions").
#
#   SO: add `actions: read` to each caller's calling job FIRST, and adopt this file second. The
#   grant is a caller-side change and is deliberately not made from here. What it costs the caller is
#   nothing: `actions: read` reads workflow and environment metadata and writes nothing.
#
#   The gate's own answer to a token that lacks the grant is a named refusal that prints the block
#   above, but it can only print it in a run that STARTED, which is a run whose caller granted at
#   least as much as this file requests. The two failure modes are different and only one of them is
#   self-explaining, which is exactly why the ordering above is not optional.
# Changesets flow: a push to main with pending changesets opens a "Version Packages" PR; merging it
# bumps versions and publishes to npm WITH PROVENANCE, uploads the docs artifacts, and fires a
# repository_dispatch to cosyte/docs so the site rebuilds. Actions are pinned to SHAs.
#
# ▶ TWO JOBS, AND THE CALLER'S `release` ENVIRONMENT HOLDS EXACTLY ONE OF THEM. READ THIS BEFORE
#   MOVING A STEP BETWEEN THEM.
#
#   A GitHub environment attaches to a JOB, never to a step: "when a workflow job references an
#   environment, the job won't start until all of the environment's protection rules pass". Until
#   2026-08-25 this file had ONE job, `release`, and that job did two unrelated things: it either
#   opened or refreshed the "Version Packages" pull request, or it published to npm. Putting the
#   environment on it therefore asked a human to approve EVERY merge to a caller's default branch,
#   including the overwhelming majority that would never touch a registry. The measured result was
#   not extra safety, it was no releases at all: the approval request that would OPEN a Version PR
#   was itself unapproved, so the queue of unshipped changesets grew while the approvals people were
#   asked for bought nothing. GitHub also cancels a job nobody approves within 30 days, so those
#   requests do not merely wait, they expire.
#
#   So the job is split on the one line that matters, which is reversibility:
#
#     `version`   NO environment. Runs the protection gate, checks out, verifies, derives the release
#                 notes, and hands `changesets/action` NO publish command at all, so it can open or
#                 refresh the Version PR and CANNOT publish. Never sees `NPM_TOKEN`.
#     `release`   `needs: version`, `if:` the version job's `is-release` output, `environment:
#                 release`. Resolves the publish path, publishes, cuts the GitHub release, dispatches
#                 the docs rebuild, and runs the post-publish install gate. This is the whole of the
#                 irreversible half.
#
#   ONE APPROVAL PER RELEASE, ON THE HALF THAT CANNOT BE UNDONE. Merging the Version PR is the human
#   decision to release; the environment approval is that same decision confirmed on the runner that
#   is about to make it permanent. Nothing is skipped and no approval is traded away.
#
#   THE JOB ID `release` IS LOAD-BEARING AND IS NOT AN AESTHETIC CHOICE. A caller's check context for
#   a reusable workflow is `<caller job id> / <called job id>`, so every caller's required-check
#   configuration names `release`. Renaming the publishing job would leave those contexts reporting
#   nothing, which is the one failure mode that BLOCKS a pull request forever rather than passing it
#   (see "What a skipped required context does to a merge" in README.md, measured on this repo).
#   On a run that opens a Version PR the `release` job is skipped by its job-level `if:`, which the
#   same measurement shows concludes `skipped` and SATISFIES a required context.
#
#   WHAT DOES NOT MOVE INTO THE SECOND JOB: the protection gate. It stays in `version`,
#   unconditional, so it runs on EVERY path including the ones that publish nothing. A gate that only
#   runs on the publish arm stops proving anything on the arm that runs every day, and it stops
#   silently. `release` needs `version`, so the gate is still ahead of every publish, twice over: it
#   is ahead in job order, and the environment it proves is the one holding the second job.
#
#   ▶ THE OTHER DIRECTION, AND IT IS WHY `release` MUST NOT BE GIVEN `always()` OR `!cancelled()`.
#     `test/skipped-required-context.test.mjs` refuses a published job that declares `needs:` and
#     skips when its dependency fails, because `skipped` satisfies a required context. That remedy
#     is forbidden HERE and the exemption is recorded in that file rather than assumed: a version
#     job that fails AFTER the notes gate still reports `is-release=true` as a job output, so a
#     `release` job opting back in would publish to npm on a run whose verification, changelog gate
#     or publish-floor check had just failed. The residual is answered by the `version` context,
#     which fails in its own right, and by AC4's refusal reaching the run as a failure.
#
# STAGED PUBLISHING, AND THE ONE SENTENCE THAT EXPLAINS EVERY STEP CONDITION MENTIONING `mode`.
# npm registry data is immutable: `package@version`, once used, can never be used again, an unpublish
# included. So the last reversible moment this pipeline had was BEFORE `changesets/action` ran. A
# version of a package that ALREADY EXISTS on the registry is now submitted to npm's staging area
# instead of being promoted to it, where a maintainer can download the exact tarball, inspect it, and
# approve it or simply walk away. An unapproved stage leaves the live registry exactly as it was.
#
#   `publish-floor.mjs`   in the `release` job, before anything is packed there: which tool performs
#                         the publish for THIS caller, whether it clears the floor that tool's
#                         staging mode needs, and whether the package exists on the registry at all.
#                         Every unknown is a refusal.
#   `staged-publish.mjs`  the publish command itself on the staged arm, in place of the caller's
#                         `pnpm run release`. It stages and stops, and never falls back to a publish.
#
# A package that has NEVER been published cannot be staged (npm's own rule) and so takes the direct
# arm unchanged, with the run saying out loud that this one is a one-way door.
#
# RELEASE NOTES. The GitHub release body is DERIVED from the changesets the "Version Packages" PR
# consumed: each is a human-written summary of one change, they are what drove the version bump, and
# the version commit deletes them, which is why `fetch-depth: 0` matters. `scripts/release-notes.mjs`
# in this repo does the derivation and is unit-tested (`test/release-notes.test.mjs`) against the 15
# changesets cosyte/hl7 consumed for v0.0.2.
#
# This pipeline REFUSES to create a release whose body does not say what changed, or whose body
# leaks internal project bookkeeping onto a public surface. Until 2026-07-27 every release body read
# "Automated release of <tag>." and nothing else; a stub that looks deliberate is the defect, so
# there is no stub fallback and no silent degradation. The refusal is asserted on the BYTES about to
# be written, by a separate entry point that knows nothing about how they were produced, because a
# check that merely confirms the renderer ran passes when the renderer returns nothing.
#
# The run FAILS, naming the offending line, on any of: an empty or stub body; a version bump that
# consumed no changesets; a consumed changeset with an empty summary; an internal project identifier
# (HL7-U, CCDA-P7, README-ORG-SWEEP); phase or slice language (Phase W, Phase 5b, "thirteenth
# slice"); an ADR number; a U+2014 em dash; or a change no consumer of the package can observe.
#
# ORDERING. Every one of those refusals now sits BEFORE npm, and structurally rather than by
# arrangement: `changesets/action` is only given a publish command when the notes gate has already
# derived a body and proved its bytes fit, so a run that cannot say what it is shipping cannot reach
# the registry. This used to be the other way round, with an error echo after the publish step
# reporting that npm had the package and the gate had not run. A published version is permanent, so
# that was a correction, not a gate. The one check that still has to follow the publish is the
# reconciliation against the version Changesets actually reported, which does not exist until it has.
#
# WHO AUTHORS THE VERSION PR, and why it is not `GITHUB_TOKEN`. GitHub does not start workflow runs
# for events produced by `GITHUB_TOKEN`. That is deliberate anti-recursion, and it is not an error
# anyone sees. So a "Version Packages" PR opened with that token arrives with ZERO checks, and a
# required status check that never reports is PENDING, not failing: with `bypass_actors: []` on the
# rulesets, nobody can merge past it, an admin included.
#
# MEASURED, not predicted, and read on 2026-07-29: `cosyte/ccda#61` ("Version Packages", head branch
# `changeset-release/main`, author `app/github-actions`) reports 0 check runs and
# `mergeStateStatus: BLOCKED`, against 4 required contexts. Do NOT cite `cosyte/hl7#63` for this: it
# is the PR the trap was FOUND on, but a human then pushed `edcf4128 chore: run CI on the version PR`
# to it, which is the manual escape, so it now reads MERGED with 8 green checks and refutes on sight
# the thing it was cited for.
#
# THE CONTROL, which is what makes this the token and not the repo or the ruleset: `cosyte/dicom#23`
# is authored by `app/dependabot`, a BOT, in a repo governed by the SAME three rulesets as ccda
# (`baseline-branch-protection`, `parser-ci-required-checks`, `emdash-required-check`), and it has 8
# checks and reports CLEAN. Repo class and ruleset held constant, actor varied, outcome flipped. An
# earlier draft cited `cosyte/.github#20` instead; that is a human-authored PR in a different repo
# under different rulesets, so it varies three things at once and shows nothing.
#
# The trap predates the rulesets; the rulesets widened it, hl7 going from 3 required contexts to 5.
#
# THE FIX is to author that PR with a credential that is not `GITHUB_TOKEN`, which is what
# `RELEASE_PR_TOKEN` is for. Two things are needed, and the second is the one that is easy to miss:
#
#   1. `GITHUB_TOKEN` in the action's `env` below, which is what it opens the PR with. The action
#      reads `process.env.GITHUB_TOKEN || core.getInput("github-token")` (src/index.ts:15 at the sha
#      pinned below), so the ENV WINS: adding a `github-token:` input while leaving the env in place
#      would be a silent no-op.
#   2. `persist-credentials: false` on the caller checkout. The version commit is pushed by
#      `git push` (src/git.ts:11) out of the caller's checkout, NOT through the API. Left at its
#      default, `actions/checkout` persists an `http.<host>.extraheader` Authorization into the local
#      git config and git sends that preemptively, so the `~/.netrc` the action writes with our token
#      (src/index.ts:49-52) is never consulted and the push stays `GITHUB_TOKEN`. Turning persistence
#      off removes the competing credential and lets the netrc be what authenticates the push.
#
# Fixing (1) alone fixes the `opened` event and leaves `synchronize` broken. A Version PR is
# force-pushed again every time another changeset lands on main, and required checks are evaluated
# against the PR's CURRENT head sha, so an update pushed by `GITHUB_TOKEN` returns the PR to zero
# applicable checks. The fix has to cover the push or it only works until the second changeset.
#
# WHY NOT JUST HAND THE PAT TO `actions/checkout`. It would also work, and it was the first draft.
# It puts an org-scoped `Contents: read+write` + `Pull requests: read+write` credential into
# `.git/config` at step ONE, where it then sits for the whole job. What the netrc route buys is
# specific and worth naming exactly: the PAT is absent during `pnpm install --frozen-lockfile`, which
# is where third-party DEPENDENCY LIFECYCLE scripts run (no caller sets `ignore-scripts`), and absent
# during the `Verify` ladder that follows it. That is the window this narrows, and it is the one that
# matters most, because it is the only window whose contents this org does not write.
#
# WHAT IT DOES NOT NARROW IS NOT RESTATED HERE, AND THAT IS THE POINT. The inventory of what runs
# while this credential is reachable stood in THREE copies (this comment, the README, and a comment
# in `scripts/install-check.mjs`) and was owned by none of them, so a correction landed in one copy
# and left the others confidently wrong. An earlier draft of THIS comment claimed the PAT arrived
# "after all third-party code has run", which is false. It has ONE owner now: the README, under
# "What it does not narrow". Read it there and put the next residual there.
#
# The facts a maintainer needs AT THIS SITE, because this file is where they are enforced:
#   - The window OPENS at `changesets/action`, which writes the token to `~/.netrc` unconditionally
#     (src/index.ts:49-52) before its arm switch, and injects it as `GITHUB_TOKEN` into `pnpm run
#     version` and `pnpm run release` (src/run.ts:94, :294). `release` is `changeset publish`, which
#     spawns `pnpm publish` (every caller declares `packageManager: pnpm@10`) WITHOUT
#     `--ignore-scripts`, so each caller's `prepublishOnly` verify ladder runs a SECOND time inside
#     that step with the token in the environment. Visible in the real hl7 0.0.3 publish (run
#     30354998951, 2026-07-28): ~55s inside the action between "is being published" and "packages
#     published successfully", which is not a 50 kB tarball upload.
#   - It CLOSES at the `Drop the release credentials from disk` step, which BOTH jobs carry
#     immediately after their `changesets/action` step rather than at the end of the job. Past it,
#     `~/.netrc` and the `~/.npmrc` the action writes with the raw NPM_TOKEN are expected to be gone,
#     the caller's `pack:docs` and the post-publish install gate included; that step warns rather
#     than fails if a removal does not take, so read its log rather than assuming. The gate's entry
#     probe additionally gets an environment built from nothing (`probeChildEnv`).
#   - NEITHER OF THOSE REACHES INSIDE THE `changesets/action` STEP ITSELF. That window is real, it
#     is the widest one in either job, and nothing here has narrowed it.
#
# Note that on the publish arm the PAT buys nothing at all: with `createGithubReleases: false` the
# action neither pushes nor opens a PR there, so its octokit goes unused. Handing it to the version
# job alone is therefore tempting and is NOT done, because the action picks its arm from ITS OWN
# reading of the pending changesets, not from the job it is in: a changeset landing on main between
# the two jobs puts the publish job on the version arm, and a job without the token would then open
# a Version PR authored by `GITHUB_TOKEN`, which is the exact trap this token exists to close. The
# exposure is accepted and written down rather than traded for that risk. What the SPLIT removed is
# the other credential: `NPM_TOKEN` is now handed to the environment-held job and to nothing else.
#
# IF THE NETRC FALLBACK DOES NOT APPLY, the push fails loudly and the run goes red with npm
# untouched, because the publish arm does not push at all: `createGithubReleases: false` means
# `git.pushTag` (src/run.ts:120, :144) is never reached, and the tag is created by `gh release
# create --target` further down. So the blast radius of that failure is a Version PR that does not
# get opened, which is strictly better than today's Version PR that opens and cannot be merged.
#
# WHAT DOES NOT CHANGE. `setupGitUser` is left at its default, and it hardcodes the git author of the
# version commit to `github-actions[bot]` (src/git.ts:62-75) regardless of which token is in play, so
# commit authorship is unaffected. Only the PR's author changes, to the token's owner.
# `commitMode: github-api` was the considered alternative, routing the push through the API; it was
# NOT taken because it also re-attributes and GPG-signs the version commit (src/git.ts:59-61 skips
# `setupUser` in that mode), which is a second behaviour change this cannot test live.
#
# ABSENT, IT WARNS RATHER THAN FAILS. `RELEASE_PR_TOKEN` is optional and falls back to
# `GITHUB_TOKEN`, which is exactly today's behaviour, trap included. Failing closed instead would
# take every caller's release pipeline down the moment this lands, to protect against a state those
# repos are already in. The fallback is announced loudly in the log rather than taken quietly,
# because a fix that silently is not applied is worse than no fix.
#
# ▶ WHERE A CALLER STORES IT NOW MATTERS, AND THE SPLIT IS WHAT MADE IT MATTER. An ENVIRONMENT
#   secret is scoped to jobs that reference that environment: GitHub's "Control deployments" says
#   "You can configure environments with protection rules and secrets [...] A job also cannot access
#   secrets that are defined in an environment until all the deployment protection rules pass", and
#   lists "Organizing secrets" and "Access control [...] restrict which branches can use certain
#   secrets" among what an environment is for. Before the split the one job referenced `release`, so
#   a `RELEASE_PR_TOKEN` stored THERE resolved. The Version PR is now opened from `version`, which
#   references no environment by design, so a token stored that way reads empty there and this file
#   takes the `GITHUB_TOKEN` fallback: the zero-checks trap above, back again.
#
#   NOT MEASURED HERE, and it does not need to be, because the run says which way it went: this is
#   read off the documented scoping rule above rather than off a live caller, and
#   `secrets.RELEASE_PR_TOKEN != ''` in the step below is the observation. A caller whose token has
#   become invisible to this job gets the "Version PR will land with zero checks" warning, exactly as
#   a caller that never set one does, so the diagnosis is in the log rather than in this comment.
#
#   IT DEGRADES RATHER THAN BREAKING, AND THE REMEDY IS CALLER-SIDE: store `RELEASE_PR_TOKEN` as a
#   REPOSITORY or ORGANIZATION secret rather than an environment one. It is written here and not
#   implemented here because nothing in this file can read a caller's secret placement, and adding an
#   input or a secret to surface it would break the contract with thirteen callers that pin `@main`.
#   `NPM_TOKEN` and `DOCS_REPO_DISPATCH_TOKEN` are unaffected by the split from either placement:
#   both are consumed in `release`, which does reference the environment.

on:
  workflow_call:
    inputs:
      package-name:
        description: "npm package name, used for the release tag + docs dispatch (e.g. @cosyte/hl7)."
        type: string
        required: true
      dispatch-docs:
        description: "Fire a repository_dispatch to cosyte/docs after publishing."
        type: boolean
        default: true
      pack-docs-cmd:
        description: "Command that builds dist-artifacts/{docs-content,source}.tar.gz."
        type: string
        default: "pnpm pack:docs"
      # THE DECLARED ALLOWANCE for the post-publish install gate below, and it is a dated exception
      # rather than a setting. A package whose dependency is absent from the registry is genuinely
      # uninstallable, and today that is TRUE AND EXPECTED for `@cosyte/transform` and `@cosyte/synth`,
      # both of which depend on `@cosyte/fhir`, which npm refuses with a persistent unexplained E403
      # (FHIR-NPM-NAME). Without this the gate would red every one of their releases for a condition
      # nobody can fix from those repos, and a permanently red gate is one people learn to ignore,
      # which is the same failure as the dispatch step that had never once executed.
      #
      # It is asserted as an EXACT allowance, not a mute: the gate refuses any absent dependency that
      # is NOT named here, so a new unpublished dependency still fails. And it is self-clearing. The
      # moment `@cosyte/fhir` publishes, nothing is absent, the installs simply pass, and the gate
      # reports the entry as stale so it gets deleted. DELETE IT THEN; it is not load-bearing.
      #
      # THE `=blocked` TAG IS `ci.yml`'s PRE-PUBLISH LAYERS SPEAKING, AND ONE GRAMMAR IS THE POINT.
      # Those layers read this same input and must tell `@cosyte/fhir` (absent for a reason expected
      # to clear) from `@cosyte/assets` and `@cosyte/docs`, which are `E404` in exactly the same way
      # and `private: true` BY DESIGN. A deliberate absence and an unexplained block must not share
      # words. Two spellings of one allowance across two gates in one repo is the drift this pipeline
      # has already been bitten by.
      #
      # `parseAllowance` strips `=blocked` AND ONLY `=blocked`, so this default is byte-identical to
      # the untagged spelling it shipped with. Any other tag stays attached, matches no dependency
      # name, and therefore excuses nothing here, which is deliberate, not incidental: `=private`
      # means "absent by design and never going to clear", and THIS gate only ever observes packages
      # that already published, where such a dependency is a permanent defect rather than an expected
      # state. A first version stripped every tag and quietly taught this gate to excuse it.
      expect-unpublished-deps:
        description: "Known-absent deps, comma separated, e.g. \"@cosyte/fhir=blocked\". See FHIR-NPM-NAME."
        type: string
        default: "@cosyte/fhir=blocked"
    secrets:
      NPM_TOKEN:
        required: true
      DOCS_REPO_DISPATCH_TOKEN:
        required: false
      # The credential that authors and pushes the "Version Packages" PR. See "WHO AUTHORS THE
      # VERSION PR" above for why `GITHUB_TOKEN` cannot. Optional so that a caller without it keeps
      # working; the run says so in the log rather than pretending it is fixed.
      #
      # SCOPE IT NARROWLY. What this job asks of it is exactly: push a branch, and open or update one
      # pull request. As a fine-grained PAT owned by the cosyte org that is `Contents: read+write`,
      # `Pull requests: read+write`, `Metadata: read`, on the caller repos and nothing else. It does
      # NOT need `Workflows: write`: the action commits with `git add .`, and what `pnpm run version`
      # changes is `package.json`, `CHANGELOG.md`, `.changeset/`, and the `VERSION` constant that
      # `scripts/sync-version.mjs` rewrites in `src/index.ts` (`src/version.ts` in dicom). None of
      # that is under `.github/workflows/`. A classic PAT with `repo` is far wider than
      # this and should not be used. Do NOT reuse `DOCS_REPO_DISPATCH_TOKEN` for it either: that one
      # needs write on cosyte/docs alone, so a single token serving both is over-scoped for each.
      RELEASE_PR_TOKEN:
        required: false

# THIS BLOCK IS ADDITIVE, AND THE WORD IS LOAD-BEARING RATHER THAN DESCRIPTIVE. "If you specify the
# access for any of these permissions, all of those that are not specified are set to `none`", so a
# declaration whose only key is `actions: read` would not add a permission, it would STRIP `contents`
# off the jobs below and 403 the very next checkout, on a fully compliant caller, with none of the
# fail-closed refusal below. `actions: read` therefore JOINS the three that were already here and
# displaces none of them. `contents` stays at `write`: the publish job creates tags and a GitHub
# release, and `write` is what grants the read `actions/checkout` needs as well as those writes.
#
# WHAT THIS BLOCK IS, NOW THAT EVERY JOB DECLARES ITS OWN. It is the workflow-level default and the
# whole of what this file REQUESTS from a caller, which is the set the elevation rule below is
# checked against. Each job then narrows it: the version job drops `id-token`, because provenance is
# a publish-time concern and that job cannot publish. A job block replaces this one rather than
# adding to it, so each job names every key it needs.
#
# ▶ `actions: read` IS THE ONE THING IN THIS FILE A CALLER HAS TO GRANT FIRST. See "THE CALLER-SIDE
#   PRECONDITION" at the top of this file. A called workflow's token can only be equal to or more
#   restrictive than its caller's, so a caller whose calling job pins
#   contents/id-token/pull-requests and no `actions` is granting `actions: none`, and this request is
#   then an ELEVATION that GitHub refuses at workflow startup. Nothing below runs in that case, this
#   gate included. Grant it in the caller first; this file second.
permissions:
  contents: write # create tags / GitHub release
  id-token: write # npm provenance
  pull-requests: write # open the "Version Packages" PR
  actions: read # read the caller's `release` environment protection (the gate in the version job)

jobs:
  # THE UN-GATED HALF, AND EVERY WORD OF THAT IS DELIBERATE. This job references NO deployment
  # environment, so it never waits on an approval, and it is handed NO publish command and NO
  # `NPM_TOKEN`, so there is nothing here for an approval to protect. What it does is open or refresh
  # the "Version Packages" pull request, which is the pull request whose MERGE is the human decision
  # to release. See "TWO JOBS" at the top of this file.
  #
  # It also carries the protection gate, unconditionally, for every path this workflow has.
  version:
    runs-on: ubuntu-latest
    # NAMED IN FULL, BECAUSE NAMING ONE KEY SETS EVERY OTHER TO `none`. "If you specify the access for
    # any of these permissions, all of those that are not specified are set to `none`", so a block
    # that asked only for what a reader thinks this job needs would strip `contents` and 403 the very
    # next checkout. `actions: read` is the gate's read of the caller's environment protection;
    # `contents: write` is the checkout plus the branch `changesets/action` pushes; `pull-requests:
    # write` is the Version PR itself. `id-token: write` is deliberately ABSENT: npm provenance is a
    # publish-time concern and this job cannot publish, so the token that signs a publish has no
    # business existing on a runner no human approved.
    permissions:
      contents: write # checkout + push the changeset-release branch
      pull-requests: write # open the "Version Packages" PR
      actions: read # read the caller's `release` environment protection (the gate below)
    # WHAT CROSSES THE JOB BOUNDARY. `is-release` is the discriminator: it is the predicate this
    # pipeline already derives, already tests and already trusted to withhold the publish command, so
    # promoting it from a step output to a job output moves no decision, it moves where the decision
    # is enforced. (`changesets/action`'s own `has-changesets` output was considered and is NOT used:
    # it does not exist until the action has already run, so it can never gate the job that runs it,
    # and this pipeline has never derived a release from it.)
    #
    # `release-notes-b64` is the release body itself, and it travels because it CANNOT be re-derived
    # on the other side. `RUNNER_TEMP` does not cross a job boundary, and re-deriving after the
    # publish is not a workaround: `changeset publish` creates the `v<version>` tag locally, and "is a
    # release pending" is answered by whether that tag exists, so a second derivation after the
    # publish always finds nothing. Derived once, here, carried whole.
    outputs:
      is-release: ${{ steps.notes.outputs.is-release }}
      version: ${{ steps.notes.outputs.version }}
      release-notes-b64: ${{ steps.notes-transfer.outputs.release-notes-b64 }}
    steps:
      # THE GATE RUNS FIRST, AND WHAT IS AHEAD OF IT IS ONLY THIS REPO'S OWN SCRIPT ARRIVING.
      #
      # A reusable workflow runs against the CALLER's checkout, so `scripts/` is not on disk until it
      # is fetched, and the gate is one of those scripts. `job_workflow_sha` is the commit of THIS
      # workflow file, so the script can never drift from the YAML that calls it even though every
      # caller pins `@main`.
      #
      # ▶ WHY THIS CHECKOUT HAPPENS TWICE, HERE AND AGAIN BELOW. `actions/checkout` at the workspace
      #   ROOT deletes the CONTENTS of that directory whenever it is not already the repository being
      #   checked out, whatever `clean:` is set to. So `.cosyte-release-tooling` cannot survive the
      #   caller checkout, and the caller checkout cannot move above it either: it has to own the
      #   workspace root for `pnpm install` and everything after. Two checkouts of one pinned sha is
      #   the price of running the gate before the caller's tree exists, and that ordering is the
      #   whole point of the gate. Deleting either one silently changes what the gate covers, which is
      #   why `test/environment-gate.test.mjs` asserts the order rather than trusting this comment.
      - name: Check out the shared release tooling (for the protection gate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cosyte/.github
          ref: ${{ github.job_workflow_sha }}
          path: .cosyte-release-tooling
          persist-credentials: false
      # THE GATE, AND IT IS THE HUMAN GATE ON npm ENFORCED RATHER THAN ASSERTED. It reads the CALLING
      # repository's `release` environment with the automatic `GITHUB_TOKEN` (a reusable workflow's
      # `github` context is the caller's, and that token is scoped to the caller's repository, so this
      # is a repository reading its own environments) and exits non-zero when the human gate is not
      # provably there: at least one required reviewer AND a deployment branch policy limited to the
      # literal default branch. Unreadable protection is not proof of protection and refuses too,
      # naming the repository and why. `scripts/environment-gate.mjs` holds the classification and the
      # wordings; README.md, "The release environment gate", holds the reasoning.
      #
      # An unprotected `release` environment produces a run that looks IDENTICAL to a genuinely gated
      # one: same environment badge on the publish job, same green steps, no approval prompt, and
      # nothing anywhere saying there was never anything to approve. Whether such an environment was
      # created by a maintainer and left unprotected or came into being on first reference is not a
      # distinction any run can make, so this pipeline does not pretend to draw it and neither does
      # the refusal.
      #
      # ▶ IT LIVES IN THE UN-GATED JOB ON PURPOSE, AND IT IS UNCONDITIONAL HERE. This job runs on
      #   every path this workflow has, publish or not, so the gate does too. Moving it into the
      #   `release` job below, or putting any `if:` above it, would leave it proving nothing on the
      #   path that runs every day: a job or step skipped by a conditional concludes `skipped`, which
      #   a required context counts as SUCCESS (measured on this repo; README.md, "What a skipped
      #   required context does to a merge"). Running it here costs nothing it needs: the gate reads
      #   the environment through the API with `actions: read`, and a job does not have to be IN an
      #   environment to read that environment's configuration. The PUBLISH does have to be in it,
      #   and it is.
      #
      # IT FAILS THE STEP AND NOTHING ELSE. It does not cancel the run: a cancelled run concludes
      # `cancelled`, and a caller's required-check reading of that is not the FAILED conclusion a
      # refusal has to be. A failed step fails this job, and the `release` job below `needs:` this
      # one, so it never starts.
      #
      # WHERE THE REFUSAL SURFACES, EXACTLY, because "it reaches the caller as a failure" is true of
      # the RUN and not of every context in it. The run concludes FAILURE, and the failure is
      # reported on THIS job's context, `<caller job id> / version`. The `release` context concludes
      # `skipped` instead, because a job whose `needs:` failed is skipped, and a required context
      # counts a skip as success (README.md, "What a skipped required context does to a merge"). So
      # `version` is the context a refusal lands on, and it is also the one that runs on every path;
      # a caller wiring a required context for this workflow wants that one. Nothing about the
      # refusal itself is softened by this: the run fails, no Version PR is opened, and the registry
      # is never reached.
      #
      # Required reviewers on a PRIVATE repository need an Enterprise plan (they are a public-repo
      # feature on Free, Pro and Team). This org is on Enterprise, so the requirement is configurable
      # on every caller and the gate has one rule and one wording for all of them, whatever a caller's
      # visibility. Configure the environment in a caller BEFORE it calls this workflow, or its first
      # release run refuses and says exactly which rule is not there.
      #
      # It runs on the runner's preinstalled Node rather than after `actions/setup-node`, deliberately:
      # `setup-node` is the step that writes the registry `.npmrc`, and the gate has to precede
      # everything that authenticates to a registry. The script is Node built-ins only.
      - name: The caller's release environment must be a proven human gate
        env:
          # `GH_TOKEN`, NOT `GITHUB_TOKEN`, and the name is load-bearing in this file. `GITHUB_TOKEN`
          # here means one thing, asserted by `test/release-notes.test.mjs`: the credential
          # `changesets/action` opens the Version PR with, which is `RELEASE_PR_TOKEN` when a caller
          # has one. This gate must read with the AUTOMATIC token, which is scoped to the calling
          # repository, and `GH_TOKEN` is already this file's name for that (the `gh` step below).
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # The default branch is in NEITHER environment payload, and four of the refusal wordings
          # name it. The script reads it from `GET /repos/{owner}/{repo}` (`Metadata: read`, which is
          # not a `permissions:` key and is always granted) so that the live branch policy is compared
          # against a default branch read on the same clock. This context value is the FALLBACK, for
          # an event whose payload carries no `repository` object. An empty comparand is never
          # compared: with both sources empty the run fails as unreadable rather than blaming a
          # compliant caller's branch policy.
          DEFAULT_BRANCH_HINT: ${{ github.event.repository.default_branch }}
        run: node .cosyte-release-tooling/scripts/environment-gate.mjs --environment release
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # Half of the version-PR fix, and the half that keeps working after the second changeset.
          # Left at its default, the GITHUB_TOKEN persisted here as an `http.<host>.extraheader`
          # outranks the `~/.netrc` that `changesets/action` writes, so the version commit's push
          # stays GITHUB_TOKEN-authored and every `synchronize` on the PR goes uncheck-ed. Clearing
          # it lets the netrc authenticate that push. Nothing else in this job pushes over git: `gh`
          # uses the API, and the tag is created by `gh release create --target` below.
          persist-credentials: false
      # The shared release tooling, RESTORED. The step above fetched it once already, for the gate;
      # the caller checkout between the two deleted it, because `actions/checkout` clears a workspace
      # root that is not already the repository it is about to clone. Same repository, same
      # `job_workflow_sha`, so every script this job runs comes from one commit of this file's own
      # tree and cannot drift from the YAML that calls it, even though every caller pins `@main`.
      - name: Check out the shared release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cosyte/.github
          ref: ${{ github.job_workflow_sha }}
          path: .cosyte-release-tooling
          persist-credentials: false
      # changesets/action stages the whole tree (`git add .`) when it opens the "Version Packages"
      # PR, so the tooling checkout has to be invisible to the caller's git or it lands in that PR.
      - name: Hide the tooling checkout from the caller's git
        run: printf '\n/.cosyte-release-tooling/\n' >> .git/info/exclude
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # NO `registry-url` IN THIS JOB, AND THE OMISSION IS THE POINT. `registry-url` is the input that
      # makes setup-node write an `.npmrc` holding `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}`
      # and point `NPM_CONFIG_USERCONFIG` at it. This job publishes nothing and is handed no
      # `NPM_TOKEN`, so asking for that file would create a registry credential file on a runner no
      # human approved, for no consumer: `pnpm install --frozen-lockfile` and `pnpm attw` both read
      # the public registry anonymously, and `registry=https://registry.npmjs.org` is a restatement of
      # pnpm's and npm's own default. The publish job below sets it, because that is the job that
      # authenticates.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          cache: pnpm
      # THE GATE. The notes are derived exactly ONCE, here, before anything is published, and the
      # publish job reuses these exact bytes rather than deriving its own. Two reasons, and the second
      # one is not obvious:
      #
      #   1. The ordinary failure then costs nothing. If the notes cannot be derived (no changesets
      #      were consumed, one has an empty summary, the body says nothing, or banned content
      #      survived translation) the run fails with npm untouched.
      #   2. Deriving again after the publish step CANNOT WORK. `changeset publish` creates the
      #      `v<version>` tag in the runner's local clone, and "is a release pending" is answered by
      #      "does that tag exist yet". After publish the answer is always no, so a second derivation
      #      finds nothing and every successful release would end red with no release created.
      #
      # On an ordinary push to main this is a no-op that writes no file and sets `is-release=false`,
      # which withholds the publish command below. That is safe on exactly two readings of "no
      # release pending", and the script distinguishes them by a `code` rather than by prose:
      #
      #   already-released  `v<version>` is already tagged, and this workflow tags only after a
      #                     publish has succeeded, so there is nothing left to publish.
      #   never-versioned   package.json's version has never changed in this repo's history, so no
      #                     changeset has ever been consumed and nothing has ever been published. The
      #                     release is not this commit, it is the version commit that the "Version
      #                     Packages" PR below is about to propose. This run's job is to open it.
      #
      # THE SECOND ONE IS A FIX, LANDED 2026-07-29, AND IT CLOSES A DEADLOCK RATHER THAN RELAXING A
      # CHECK. `cli`, `deid` and `synth` are at 0.0.0 and have never published, because this step
      # refused every one of their runs: refusing here means `changesets/action` never runs, so no
      # Version PR is opened, so the version never moves off 0.0.0, so the next run refuses for the
      # same reason. (`transform` was a fourth, and reached 0.0.1 hours before this landed by merging
      # a Version PR opened on 2026-07-22, before this gate was made fail-closed. That route needs a
      # PR that already exists; `cli` and `synth` have none, and could not open one.) A repo
      # with no previous version and no consumed changeset has nothing for this gate to assert about,
      # and the first release still goes through the gate WHOLE: by then the version commit exists,
      # with a real previous version and real consumed changesets. Nothing is skipped; it is deferred
      # by one commit, to the commit that has something to say.
      #
      # When the step cannot classify the commit at all it fails HERE instead, which is the case that
      # used to publish first and complain afterwards.
      - name: Release notes must be derivable
        id: notes
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
        run: |
          node .cosyte-release-tooling/scripts/release-notes.mjs prepare \
            --repo . --package "$PACKAGE_NAME" --out "$RUNNER_TEMP/release-notes.md"
      # THE BYTES CROSS THE JOB BOUNDARY HERE, AND THIS STEP EXISTS BECAUSE `RUNNER_TEMP` DOES NOT.
      #
      # `$RUNNER_TEMP` is per-job. The publish job runs on a different runner with a different temp
      # directory, so the file the step above wrote is simply not there. The alternative to carrying
      # it is re-deriving it after the approval, and that is not an alternative: `prepare` answers "is
      # a release pending" by whether `v<version>` is already tagged, `changeset publish` creates that
      # tag, and so a second derivation on the far side of the publish always reports nothing pending
      # and every successful release would end red with no release body created. Derived once,
      # carried whole, asserted on both sides of the publish.
      #
      # WHY A JOB OUTPUT AND NOT AN UPLOADED ARTIFACT. Both are "the bytes travel"; the job output
      # adds no action to this file's pinned dependency set, and every action here is pinned to a
      # commit SHA that a human has read. An artifact round trip would add `actions/download-artifact`
      # as a fourteenth pinned third-party step for a payload of a few kilobytes that is never read by
      # anything outside this run.
      #
      # BASE64, AND IT IS NOT DECORATION. A job output is a single string, the body is multi-line
      # markdown written by humans, and the release body is the thing being protected: a transport
      # that silently eats a trailing newline, or that a body line beginning with a chosen heredoc
      # delimiter can terminate early, would corrupt exactly the bytes two `assert` calls exist to
      # prove. Base64 has neither failure mode, and it is byte-exact by construction. A malformed
      # payload fails `base64 -d` on the far side, which fails that step, which fails the publish job
      # BEFORE npm is reached.
      - name: Carry the release notes across the job boundary
        id: notes-transfer
        if: ${{ steps.notes.outputs.is-release == 'true' }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [ ! -s "$notes" ]; then
            echo "::error::The release-notes gate reported a pending release but wrote no body to" \
                 "$notes. Refusing to hand the publish job an empty release body."
            exit 1
          fi
          printf 'release-notes-b64=%s\n' "$(base64 -w0 < "$notes")" >> "$GITHUB_OUTPUT"
          echo "Carrying $(wc -c < "$notes") bytes of release notes to the publish job."
      # Say plainly, in the log of the run that is about to open the PR, whether the PR it opens will
      # be mergeable. Without the token this is not a degraded fix, it is no fix, and the symptom
      # (a PR sitting at zero checks) reads like a slow queue rather than a permanent block.
      #
      # It sits AFTER the notes gate purely so it can read `is-release`, which is the closest signal
      # available here to "this run opens no Version PR". Be precise about what it actually means:
      # `is-release == 'true'` means the publish command is NOT withheld, which USUALLY but not
      # always coincides with the action's own publish arm (`!hasChangesets && hasPublishScript`).
      # `is-release` is derived from version-versus-tag and has no view of pending changesets, so a
      # version-commit run that failed before `changeset publish` and was followed by a push carrying
      # a new changeset would have `is-release == 'true'` AND pending changesets, and the advisory
      # would be suppressed on a run that does open a PR. That costs one missing annotation on a rare
      # run, and it is why the suppression is used for a LOG LINE and emphatically not for the token
      # itself: the same non-equivalence, applied there, would hand `GITHUB_TOKEN` back to the PR.
      # It does not identify the converse either; on `false` this run may or may not have pending
      # changesets, which is why the text is conditional rather than an assertion.
      #
      # The token branch is deliberately in bash rather than a step-level `if`: the `secrets` context
      # is not available to `jobs.<id>.steps.<id>.if`. That is caught rather than silent (actionlint,
      # which self-check.yml runs over this repo, reports "context \"secrets\" is not allowed here"
      # and exits 1, verified 2026-07-29), but the way to satisfy it is `env`, which can read it.
      - name: Report whether a version PR would be able to run its checks
        if: ${{ steps.notes.outputs.is-release != 'true' }}
        env:
          HAS_RELEASE_PR_TOKEN: ${{ secrets.RELEASE_PR_TOKEN != '' }}
        shell: bash
        run: |
          if [ "$HAS_RELEASE_PR_TOKEN" = "true" ]; then
            echo "RELEASE_PR_TOKEN is set. If this run opens a Version Packages PR, that PR will be"
            echo "authored by the token's owner, so its required checks will actually run."
          else
            echo "::warning title=Version PR will land with zero checks::RELEASE_PR_TOKEN is not set, so if this run opens a Version Packages PR it will be authored by GITHUB_TOKEN. GitHub does not start workflow runs for that token's events, required checks that never report count as PENDING rather than failing, and with bypass_actors empty the PR cannot be merged by anyone, an admin included. Set RELEASE_PR_TOKEN to fix it. If you believe it IS set, check WHERE: this job references no deployment environment, so a secret stored on the release ENVIRONMENT is not readable here. Move it to a repository or organization secret."
          fi
      # THE PUBLISH PATH IS NOT RESOLVED IN THIS JOB, AND THAT IS THE SPLIT SPEAKING RATHER THAN AN
      # OMISSION. `publish-floor.mjs` answers "which tool publishes for this caller, does it clear
      # that tool's staging floor, and does this package exist on the registry at all", and its
      # answer is read by three step conditions in the `release` job below. A step output does not
      # cross a job boundary, and the tool it measures is the one on the runner that PUBLISHES, so
      # the step lives there, ahead of that job's `pnpm install` and its `Verify` ladder. This job's
      # own ladder does pack, in `pnpm attw`, and that tarball is read by attw and thrown away: this
      # job is handed no publish command and no `NPM_TOKEN`, so nothing it packs can be promoted
      # anywhere and there is no floor for it to owe.
      - run: pnpm install --frozen-lockfile
      - name: Verify
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm attw
      # THE ONLY STEP IN THIS PIPELINE THAT OPENS `CHANGELOG.md`, AND IT IS HERE BECAUSE CHANGESETS
      # SWALLOWS A FAILED CHANGELOG WRITE WITH `console.warn`.
      #
      # `changeset version` bumps `package.json`, consumes the changesets, and writes the release
      # section into `CHANGELOG.md`. Only the third of those may fail quietly: when the changelog
      # generator throws -- a declared Prettier config that cannot be resolved is the case that was
      # reproduced -- Changesets catches it, warns, and completes. The version is bumped, the
      # changesets are gone, and NO changelog is written at all. The Version PR then looks ordinary,
      # merges, and this workflow publishes a tarball whose own `CHANGELOG.md` does not mention the
      # version inside it. Nothing above notices: `format:check` reads valid markdown, and
      # `release-notes.mjs` composes the release body from `.changeset/*.md` and never opens the
      # changelog. The run reports success. A published version is permanent (ADR 0001).
      #
      # IT RUNS IN THE UN-GATED JOB, WHICH IS WHAT MAKES IT A GATE RATHER THAN A REPORT: at this point
      # npm is untouched, the publish job has not been asked for, and the cost of being wrong is a
      # re-run rather than a human's approval spent on a release that was never going to be correct.
      # It reads the version from the notes gate above rather than re-deriving it, so the two cannot
      # disagree.
      #
      # IT IS A NO-OP FOR A CALLER THAT HAND-MAINTAINS ITS CHANGELOG, decided from that caller's own
      # `.changeset/config.json` rather than from a list of repo names kept here. Repos move onto the
      # generator one at a time and a list would be stale in the direction that matters: a repo that
      # has just turned it on is exactly the repo this gate should now cover. Census on 2026-08-06,
      # over all thirteen callers: seven have the generator on, six off, and NONE goes red, because
      # twelve are already tagged (the gate is skipped on `is-release != 'true'`) and the thirteenth,
      # `fhir`, has the generator off and reports `not-applicable`. That is a dated measurement, not
      # a standing guarantee.
      - name: The changelog must carry a section for the version being released
        if: ${{ steps.notes.outputs.is-release == 'true' }}
        env:
          NOTES_VERSION: ${{ steps.notes.outputs.version }}
        run: |
          node .cosyte-release-tooling/scripts/changelog-check.mjs \
            --repo . --version "$NOTES_VERSION"
      # ▶ THE VERSION-PR ARM, AND THE PUBLISH COMMAND IS NOT WITHHELD HERE, IT DOES NOT EXIST HERE.
      #
      #   `changesets/action` runs the publish command itself, so the ONLY place a publish can be
      #   prevented is the input that supplies it. This step declares no `publish:` key at all, which
      #   is a stronger statement than an expression that evaluates to the empty string: there is no
      #   edit to a condition, no output that can disagree with itself, and no secret in this job's
      #   environment that a publish could authenticate with. The whole publish path is in the
      #   `release` job below, behind the caller's environment.
      #
      #   Read against the action's own source at the SHA pinned below, because the behaviour of this
      #   step rests on how it branches. It publishes on exactly one arm, `!hasChangesets &&
      #   hasPublishScript`, and `hasPublishScript` is false here forever. With pending changesets it
      #   takes `case hasChangesets` and opens or force-pushes the "Version Packages" PR whether or
      #   not a publish command is set, which is exactly the arm this job exists for. With neither
      #   (the version commit itself) it logs and returns, having set `published=false`, which is the
      #   no-op it has always been on that commit.
      #
      #   THE STEP IS UNCONDITIONAL, and that is the precondition the first-release fix rests on. A
      #   `never-versioned` repo lands on `is-release=false` and is USEFUL anyway, because this step
      #   still runs and opens the Version PR that moves the version off its scaffold value. An
      #   `if:` here would look like tightening a gate and would silently restore a deadlock: a green
      #   run that opens no PR, forever.
      #
      #   ONE KNOWN CONSEQUENCE, recorded rather than hidden, and it is not cosmetic. The action
      #   passes hasPublishScript into the "Version Packages" PR body, so with no publish command the
      #   body reads "publish to npm yourself or setup this action to publish automatically". That
      #   does not merely understate what merging does: it invites a reader to publish by hand, which
      #   is the one route around everything here. It is left alone because the alternative is worse.
      #   Changing it means re-deriving "are there pending changesets" against the action's own
      #   readChangesetState, and a predicate that disagrees with it by a single empty changeset file
      #   is a predicate that hands a publish command to the wrong arm. A misleading sentence is
      #   recoverable; that is not.
      - name: Create or refresh the "Version Packages" pull request
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          # `pnpm run version`, NOT `pnpm version`, which is pnpm's built-in and shadows the script.
          version: pnpm run version
          # Defaults to TRUE, which cuts a GitHub release from this un-gated job. Nothing here has
          # published anything for a release to describe, and the release job below is the one that
          # creates the single release, at the tag, with the docs artifacts and the derived notes.
          createGithubReleases: false
        env:
          # The other half of the version-PR fix: this is the token the action opens the PR with.
          # It MUST be set here rather than via the `github-token` input, which this env var takes
          # precedence over in the action's own source at the sha pinned above.
          #
          # NO `NPM_TOKEN` AND NO `NODE_AUTH_TOKEN`, WHICH IS THE POINT OF THE SPLIT. Before the
          # split this step held both, in the one job the environment gated, so the npm credential
          # was reachable only after an approval. A version job that inherited them would be a new
          # window on a write credential that no human ever approved, and it would be a new window
          # even though nothing in this job can publish. There is nothing to leak here because there
          # is nothing here.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
      # DELETE THE RELEASE CREDENTIAL FROM DISK AS SOON AS ITS LAST CONSUMER HAS FINISHED.
      #
      # `changesets/action` writes `~/.netrc` itself, in the step above, unconditionally
      # (src/index.ts:49-52 at the sha pinned above) and before its arm switch, and it removes it
      # never. Left alone it survives to job end, readable by every step below. Its only reader is
      # the `git push` the action makes inside its own step, so there is no consumer from here.
      #
      # `~/.npmrc` is swept too, and in THIS job it is expected to be absent: the action writes it
      # only on the publish arm (src/index.ts:79-107), which needs a publish command this job does
      # not supply and an `NPM_TOKEN` this job is not handed. The sweep is written the same way in
      # both jobs on purpose: a step that only removes what it expects to find stops removing the
      # thing nobody expected. The line numbers are read out of the action at that sha, and a bump
      # can move them while this step still exits 0 and still prints "Removed";
      # `test/install-check.test.mjs` pins the sha for exactly that reason.
      #
      # `rm` is safe on a hosted runner specifically because `runs-on` is pinned to `ubuntu-latest`
      # in this file, so there is no persistent user npmrc to destroy. It warns rather than fails,
      # with `always()` rather than `!cancelled()` so a cancelled run is scrubbed too; it is two
      # `rm`s and cannot hang.
      - name: Drop the release credentials from disk
        if: ${{ always() }}
        shell: bash
        run: |
          left=""
          for f in "$HOME/.netrc" "$HOME/.npmrc"; do
            [ -e "$f" ] || continue
            # `|| true` IS LOAD-BEARING, not defensive noise. GitHub runs `shell: bash` as
            # `bash --noprofile --norc -eo pipefail`, so a bare failing `rm` exits the step at
            # once and the warn branch below, which is the whole reason this step does not fail,
            # never runs. Measured: an `.npmrc` that is a directory, and an unwritable `$HOME`,
            # both exit 1 without it. Neither is reachable on a hosted runner today.
            rm -f "$f" || true
            if [ -e "$f" ]; then left="$left $f"; else echo "Removed $f."; fi
          done
          if [ -n "$left" ]; then
            echo "::warning title=Release credential still on disk::Could not remove:$left. A credential changesets/action wrote stays readable for the rest of this job."
          fi

  # ▶ THE IRREVERSIBLE HALF, AND THE ONLY JOB THE CALLER'S `release` ENVIRONMENT HOLDS.
  #
  #   THE JOB ID IS `release` AND MUST STAY `release`. A caller's check context for a reusable
  #   workflow is `<caller job id> / <called job id>`, so this identifier is the one every caller's
  #   required-check configuration was written against. Renaming it would leave those contexts
  #   reporting nothing at all, and a required context that never reports leaves a pull request
  #   PENDING and unmergeable by anyone, an admin included. That is the loud failure; the quiet one
  #   is worse and is why the gate above is not in here.
  #
  #   `needs: version` is what makes the protection gate above load-bearing for this job: this job
  #   cannot start until that one has succeeded, and that one refuses the run unless the caller's
  #   `release` environment is a proven human gate. So the environment on this job is both proven
  #   and enforced, in that order.
  #
  #   `if:` IS THE DISCRIMINATOR, AND IT IS `is-release`, DERIVED IN THE JOB ABOVE. It is the same
  #   predicate that used to withhold the publish command inside the single job, so nothing about
  #   WHEN this pipeline publishes has changed; only where the decision is enforced has. On a run
  #   that opens a Version PR this job is skipped, its check run concludes `skipped`, and a required
  #   context counts that as success (README.md, "What a skipped required context does to a merge",
  #   measured on this repository rather than reasoned about).
  release:
    needs: version
    if: ${{ needs.version.outputs.is-release == 'true' }}
    runs-on: ubuntu-latest
    # THE HUMAN GATE ON npm publish. This key puts THIS job, and only this job, in the caller's
    # `release` environment: "when a workflow job references an environment, the job won't start
    # until all of the environment's protection rules pass", and "a job also cannot access secrets
    # that are defined in an environment until all the deployment protection rules pass". Everything
    # that can reach the registry is inside it. Nothing that merely proposes a release is.
    #
    # A job nobody approves within 30 days fails automatically, which is a real cost and the reason
    # the version job is not in here: an approval request that buys nothing still expires, and the
    # measured effect of asking for one on every merge was a pipeline that released nothing at all.
    environment: release
    # NAMED IN FULL for the same reason as the version job: one named key sets every unnamed key to
    # `none`. `contents: write` creates the tag and the GitHub release; `id-token: write` is npm
    # provenance; `pull-requests: write` is there because `changesets/action` can still take its
    # version arm if a changeset lands between the two jobs, and a 403 on that arm would be a
    # confusing failure of a run that has already been approved; `actions: read` keeps this job's
    # token shaped like the version job's, so a caller grants one set for both.
    permissions:
      contents: write # create tags / GitHub release
      id-token: write # npm provenance
      pull-requests: write # the action's version arm, if a changeset lands between the jobs
      actions: read # keep both jobs' token requests identical for the caller
    steps:
      # The tooling arrives first here as well, and for the same reason: a reusable workflow runs
      # against the CALLER's checkout, so `scripts/` is not on disk until it is fetched.
      # `job_workflow_sha` is the commit of THIS workflow file, so every script this job runs comes
      # from one commit of this file's own tree even though every caller pins `@main`.
      - name: Check out the shared release tooling (for the release-notes gate)
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cosyte/.github
          ref: ${{ github.job_workflow_sha }}
          path: .cosyte-release-tooling
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          # `changeset publish` runs `git push` for the tag out of this checkout. Left at its
          # default, `actions/checkout` persists an `http.<host>.extraheader` Authorization into the
          # local git config that outranks the `~/.netrc` the action writes, which is the same trap
          # documented at the top of this file. Nothing else in this job pushes over git: `gh` uses
          # the API, and the tag is created by `gh release create --target` below.
          persist-credentials: false
      # The tooling, RESTORED: the caller checkout above deleted it, because `actions/checkout`
      # clears a workspace root that is not already the repository it is about to clone.
      - name: Check out the shared release tooling
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: cosyte/.github
          ref: ${{ github.job_workflow_sha }}
          path: .cosyte-release-tooling
          persist-credentials: false
      # changesets/action stages the whole tree (`git add .`) on its version arm, so the tooling
      # checkout has to be invisible to the caller's git or it lands in a commit.
      - name: Hide the tooling checkout from the caller's git
        run: printf '\n/.cosyte-release-tooling/\n' >> .git/info/exclude
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      # `registry-url` makes setup-node write an .npmrc holding
      # `//registry.npmjs.org/:_authToken=${NODE_AUTH_TOKEN}` and point NPM_CONFIG_USERCONFIG at it.
      # It is declared in THIS job and nowhere else, because this is the only job that authenticates
      # to a registry.
      #
      # WHAT THE v6 -> v7 MAJOR CHANGED HERE, AND WHY IT IS SAFE, MEASURED 2026-08-03 RATHER THAN
      # ASSUMED. v6 exported a DUMMY `NODE_AUTH_TOKEN=XXXXX-XXXXX-XXXXX-XXXXX` job-wide whenever the
      # caller had not set one; v7 (actions/setup-node#1558) exports it only when it is already set.
      # So in every step below that does not set it, that `${NODE_AUTH_TOKEN}` no longer resolves.
      #
      # The effect is a WARNING, not a failure, and it is bigger than the token line: pnpm's
      # env-replace throws, and pnpm catches it at FILE scope and discards the WHOLE userconfig,
      # `registry=` included. Measured on pnpm 10.0.0, 10.34.5 and 11.17.0 (the `packageManager`
      # versions pinned across the callers): `pnpm install --frozen-lockfile` prints
      # "Failed to replace env in config" on STDERR and exits 0, and dropping `registry=` is a no-op
      # because it is restating pnpm's default. `pnpm attw` shells out to `npm pack`, and npm's own
      # env-replace does not throw at all: it leaves the literal `${NODE_AUTH_TOKEN}` and exits 0
      # (checked on npm 10.9.8 and 11.16.0).
      #
      # ▶ THE LATENT HALF, so it is not rediscovered: this is benign ONLY because the discarded
      # `registry=` equals pnpm's default. ADD A `scope:` INPUT HERE AND THE DISCARDED LINE BECOMES A
      # SCOPED REGISTRY THAT SILENTLY STOPS APPLYING to every step that lacks the token. If a scope
      # is ever needed, set `NODE_AUTH_TOKEN` at JOB level too, not just on the publish step.
      #
      # The publish path is unaffected either way: the `changesets/action` step below sets
      # `NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}` explicitly, and nothing else here authenticates
      # to a registry.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: "22"
          registry-url: "https://registry.npmjs.org"
          cache: pnpm
      # THE RELEASE NOTES ARRIVE, THEY ARE NOT RE-DERIVED. These are the exact bytes the version job
      # derived before anyone was asked to approve anything, carried across the job boundary as a
      # base64 job output because `RUNNER_TEMP` is per-job and a second derivation on this side of
      # the publish is impossible (see "THE BYTES CROSS THE JOB BOUNDARY HERE" in the version job).
      #
      # It fails closed three ways: an empty output, a payload `base64 -d` will not decode, and a
      # decoded file with no bytes in it all fail this step, and this step is ahead of everything
      # that authenticates to a registry or publishes.
      - name: Restore the release notes derived before the approval
        env:
          RELEASE_NOTES_B64: ${{ needs.version.outputs.release-notes-b64 }}
        shell: bash
        run: |
          notes="$RUNNER_TEMP/release-notes.md"
          if [ -z "$RELEASE_NOTES_B64" ]; then
            echo "::error::No release notes arrived from the version job. This job publishes the" \
                 "body that job derived and derives none of its own; refusing to publish without it."
            exit 1
          fi
          printf '%s' "$RELEASE_NOTES_B64" | base64 -d > "$notes"
          if [ ! -s "$notes" ]; then
            echo "::error::The release notes carried from the version job decoded to an empty file."
            exit 1
          fi
          echo "Restored $(wc -c < "$notes") bytes of release notes derived by the version job."
      # PROVE THE BYTES BEFORE npm SEES ANYTHING. `prepare` validated the body it rendered in memory,
      # in the other job; this reads the finished file back through the entry point that knows
      # nothing about how it was produced, and it runs while npm is still untouched. It is
      # unconditional in this job because this job only exists when a release is pending.
      - name: Release notes must be fit to publish
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          NOTES_VERSION: ${{ needs.version.outputs.version }}
        run: |
          node .cosyte-release-tooling/scripts/release-notes.mjs assert \
            --file "$RUNNER_TEMP/release-notes.md" \
            --expect-version "$NOTES_VERSION" --expect-package "$PACKAGE_NAME"
      # THE PUBLISH PATH IS RESOLVED HERE, BEFORE ANYTHING IS PACKED IN THE JOB THAT PUBLISHES, AND
      # IT DECIDES THE ARM BELOW.
      #
      # Two questions, one step, both answered before a single byte is packed on this runner:
      #
      #   WHICH TOOL PUBLISHES, AND DOES IT CLEAR ITS OWN FLOOR. There is no single floor and
      #   asserting `npm --version >= 11.15.0` here would be wrong. Since pnpm 11, `pnpm publish` is
      #   implemented natively and does not delegate to the npm CLI, so on a pnpm-11 caller the npm
      #   bundled with Node governs nothing and `pnpm stage` (added in pnpm v11.3.0) is the
      #   capability in play. On a pnpm-10 caller the delegation is real and npm's own floor binds.
      #   The `packageManager` versions measured across the callers are pnpm 10.0.0, 10.34.5 and
      #   11.17.0, so BOTH arms exist in this org today. `publish-floor.mjs` reads the caller's tree
      #   and the caller's binaries at runtime; no number in this file decides it.
      #
      #   IS THIS PACKAGE STAGEABLE AT ALL. npm is explicit that a package "already exists on the npm
      #   registry - you cannot stage a brand-new package", so a first publish is a one-way door and
      #   this step says so out loud rather than letting it look like every other release.
      #
      # ▶ THIS STEP CAN TURN A WORKING RELEASE PATH RED, AND THAT IS THE DECLARED FAIL-SAFE RATHER
      #   THAN A DEFECT. A caller whose resolved publish tool is below the floor its mode needs
      #   cannot release again until it raises its own `packageManager` pin or its own Node. That fix
      #   belongs in the CALLING repository; nothing here can or should make it. The refusal names the
      #   version found and the floor needed so the caller does not have to come and read this file.
      #
      # ▶ IT IS IN THIS JOB AND CARRIES NO `if:` OF ITS OWN, AND BOTH HALVES OF THAT ARE THE SPLIT.
      #   It measures the tool on the runner that PUBLISHES, and its answer is read by three step
      #   conditions below through `steps.publish-floor.outputs.mode`, which is a STEP output and
      #   does not cross a job boundary; so it belongs here and nowhere else. Before the split it
      #   carried `if: steps.notes.outputs.is-release == 'true'`, which is now this JOB's own
      #   condition, pinned whole a few lines above: this job exists only on the runs that publish,
      #   so the step condition would be a tautology, and a tautology in front of the step that
      #   decides the publish arm is an invitation to edit it. A run that opens a Version PR never
      #   reaches this job, so there is still no floor owed on that path.
      #
      # IT PRECEDES `pnpm install` DELIBERATELY, which puts it ahead of the `Verify` ladder below.
      # `pnpm attw` shells out to `npm pack`, so "before anything is packed" is only true on this side
      # of that step. The un-gated job's own ladder packs for `attw` and throws the tarball away; it
      # is handed no publish command and no `NPM_TOKEN`, so nothing it packs can be promoted.
      - name: Resolve the publish path and prove it clears its floor
        id: publish-floor
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
        run: |
          node .cosyte-release-tooling/scripts/publish-floor.mjs --package "$PACKAGE_NAME" --repo .
      - run: pnpm install --frozen-lockfile
      # RUN IN FULL AGAIN, ON THE RUNNER THAT ACTUALLY PUBLISHES. The version job ran this ladder
      # too, on the same commit, and that is not a reason to skip it here: this job builds the tree
      # that `changeset publish` packs and that `pack:docs` reads, and a published version is
      # permanent. The cost is a few minutes; the alternative is publishing a tree nothing in this
      # job ever verified.
      - name: Verify
        run: |
          pnpm typecheck
          pnpm lint
          pnpm test
          pnpm build
          pnpm attw
      # ▶ THE PUBLISH, AND EVERY STEP THAT CAN REACH THE REGISTRY IS INSIDE THIS ENVIRONMENT-HELD JOB.
      #
      #   The action publishes on exactly one arm, `!hasChangesets && hasPublishScript`. It reaches
      #   this job only when the version job derived a release, so the changesets are consumed and
      #   the publish command below is what it takes. If a new changeset landed on main between the
      #   two jobs the action takes its version arm instead and opens a PR: no publish, which is the
      #   correct answer to "the tree moved under the approval".
      #
      #   `version: pnpm run version` is declared for exactly that arm, and it is `pnpm run version`
      #   rather than `pnpm version`, which is pnpm's built-in and shadows the script.
      - name: Publish to npm
        id: changesets
        uses: changesets/action@a45c4d594aa4e2c509dc14a9f2b3b67ba3780d0d # v1
        with:
          version: pnpm run version
          # ▶ THE STAGED ARM IS SELECTED ON THIS LINE, AND THAT IS THE WHOLE REASON IT CAN BE
          #   SELECTED WITHOUT EDITING A SINGLE CALLER. The command that publishes lives in each
          #   caller's `package.json` (`release` is `changeset publish`), but the STRING handed to
          #   the action is composed in THIS repository. So when `publish-floor.mjs` above reports
          #   that the package already exists on the registry, the action is handed our own script
          #   instead, and it submits the version to the npm staging area rather than promoting it.
          #   No caller's `package.json`, `packageManager` or workflow changes.
          #
          #   THE DIRECT ARM IS BYTE-IDENTICAL TO WHAT SHIPPED BEFORE. A package that has never been
          #   published still takes `pnpm run release` and behaves exactly as it always has, because
          #   npm cannot stage a brand-new package and demanding it would red a correct first release.
          #
          #   `mode` is `staged`, `direct` or `refused`, and a refusal never reaches this line at all
          #   because it exits the step above non-zero. Only the literal `staged` selects the staged
          #   command, so every other value, an unrecognised one included, lands on the path this
          #   pipeline has been running all along.
          #
          #   WHERE THE WITHHOLDING WENT, because it is no longer on this line and that is deliberate.
          #   Before the split this input read `is-release == 'true' && (...) || ''`, and the empty
          #   string was the only thing standing between an ordinary merge and npm. It is now the
          #   job-level `if:` above, which is stronger in two ways: the un-gated job declares no
          #   `publish:` key AT ALL, so there is no expression there to weaken, and this job does not
          #   start on a non-release run, so there is nothing here to withhold from. Both halves are
          #   pinned whole by `test/release-notes.test.mjs` and `test/environment-gate.test.mjs`.
          publish: ${{ steps.publish-floor.outputs.mode == 'staged' && format('node .cosyte-release-tooling/scripts/staged-publish.mjs stage --package {0}', inputs.package-name) || 'pnpm run release' }}
          # Defaults to TRUE, which cuts a SECOND GitHub release next to the one the step below
          # creates: two releases for one publish (x12 shipped 0.0.1 that way). It is also the wrong
          # release: it carries no docs artifacts, and because every caller sets `"changelog": false`
          # and hand-maintains CHANGELOG.md, the action finds no `## <version>` heading and dumps the
          # WHOLE file, `## [Unreleased]` and all, into the release body. `changeset publish` still
          # creates and pushes the `v<version>` git tag; the step below attaches the artifacts to it.
          createGithubReleases: false
        env:
          # Same credential as the version job's step, for the version arm described above, and it
          # MUST be set here rather than via the `github-token` input, which this env var takes
          # precedence over in the action's own source at the sha pinned above.
          GITHUB_TOKEN: ${{ secrets.RELEASE_PR_TOKEN || secrets.GITHUB_TOKEN }}
          # THE npm CREDENTIAL, AND THIS IS THE ONLY JOB IN THIS FILE THAT IS EVER HANDED IT. It is
          # reachable here only because the caller's `release` environment let this job start, which
          # is the whole of what the split bought.
          NPM_TOKEN: ${{ secrets.NPM_TOKEN }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
          # npm provenance requires a PUBLIC source repo; auto-enables when the calling repo is public.
          NPM_CONFIG_PROVENANCE: ${{ github.event.repository.visibility == 'public' }}
          # Where `staged-publish.mjs stage` leaves what it staged, and where the report step below
          # looks for it. Named in one place so the two cannot drift onto different paths; the script
          # defaults to the same file when the variable is absent, so a hand run still works.
          STAGED_PUBLISH_REPORT: ${{ runner.temp }}/staged-publish.json
      # DELETE THE RELEASE CREDENTIALS FROM DISK AS SOON AS THEIR LAST CONSUMER HAS FINISHED, which
      # is why this step sits immediately after the action rather than at the end of the job.
      #
      # WHICH TWO FILES, AND THE LINE NUMBERS BELOW, ARE READ OUT OF `changesets/action` AT THE SHA
      # PINNED ABOVE. A bump can move them, and this step would still exit 0 and still print
      # "Removed" while leaving the new location untouched. `test/install-check.test.mjs` pins that
      # sha for this reason: when it reds on a bump, re-read `src/index.ts` rather than the pin.
      #
      # `changesets/action` writes BOTH of these itself, in the step above, and removed neither.
      # They survived to job end, readable by every step below, the post-publish install gate
      # included, whose entry probe evaluates third-party module-init code from a range-resolved
      # tree. TWO files, not one, and the second is the one an earlier draft of this step missed:
      #
      #   ~/.netrc   the git credential: `RELEASE_PR_TOKEN`, or the `GITHUB_TOKEN` fallback. Written
      #              unconditionally (src/index.ts:49-52), before the action's arm switch.
      #   ~/.npmrc   `//registry.npmjs.org/:_authToken=` with the RAW `NPM_TOKEN` in plaintext
      #              (src/index.ts:79-107), written on the PUBLISH arm, which is exactly the arm
      #              that sets `published == 'true'` and is therefore the only one on which the
      #              entry probe below ever runs.
      #
      # NEITHER HAS A CONSUMER FROM HERE. The netrc's only reader is the `git push` the action makes
      # inside its own step. The `~/.npmrc` is not even what authenticated the publish: `setup-node`
      # exports `NPM_CONFIG_USERCONFIG` job-wide pointing at its own file under `RUNNER_TEMP`, and a
      # userconfig set that way outranks `~/.npmrc`. Everything below authenticates some other way:
      # `gh` with `GH_TOKEN`, `actions/upload-artifact` with the runtime token, and the install gate
      # deliberately anonymously, with its own userconfig and its own cache. No step below pushes
      # over git or publishes to npm. IF YOU ADD ONE THAT DOES, it fails loudly rather than quietly
      # reaching for a token, and the fix is to put it above this step, not to delete this step.
      #
      # WHAT THIS DOES NOT REMOVE, so the log is not read as a clean-runner claim: the `RUNNER_TEMP`
      # npmrc `setup-node` wrote, which holds the literal unexpanded `${NODE_AUTH_TOKEN}` and no
      # secret (setup-node v7 stopped exporting that variable job-wide); and the caller's checkout,
      # which is a public repo. `rm` is safe on a hosted runner specifically because `runs-on` is
      # pinned to `ubuntu-latest` in this file, so there is no persistent user npmrc to destroy.
      #
      # IT WARNS RATHER THAN FAILS, on the same axis the dispatch step below turns on: by this point
      # npm has published permanently, redding the run would not remove the credentials, and it would
      # skip the GitHub release and the docs artifacts for a package that really did ship. `always()`
      # rather than `!cancelled()` so a cancelled run is scrubbed too; it is two `rm`s and cannot hang.
      - name: Drop the release credentials from disk
        if: ${{ always() }}
        shell: bash
        run: |
          left=""
          for f in "$HOME/.netrc" "$HOME/.npmrc"; do
            [ -e "$f" ] || continue
            # `|| true` IS LOAD-BEARING, not defensive noise. GitHub runs `shell: bash` as
            # `bash --noprofile --norc -eo pipefail`, so a bare failing `rm` exits the step at
            # once and the warn branch below, which is the whole reason this step does not fail,
            # never runs. Measured: an `.npmrc` that is a directory, and an unwritable `$HOME`,
            # both exit 1 without it. Neither is reachable on a hosted runner today.
            rm -f "$f" || true
            if [ -e "$f" ]; then left="$left $f"; else echo "Removed $f."; fi
          done
          if [ -n "$left" ]; then
            echo "::warning title=Release credential still on disk::Could not remove:$left. A credential changesets/action wrote stays readable for the rest of this job, the post-publish install probe included."
          fi

      # SAY, ON THE RUN'S OWN SURFACE, THAT A VERSION IS SITTING IN STAGING WAITING FOR A HUMAN.
      #
      # A staged version that nobody is told about is the failure this whole change exists to avoid in
      # the other direction: a release that looks finished and is not. So the package, the version and
      # the identifier or command a maintainer needs to review it go into the job summary and into an
      # annotation, not only into the publish step's log.
      #
      # IT NEVER PROMOTES OR DISCARDS ANYTHING, AND IT COULD NOT IF IT WANTED TO. npm prompts for 2FA
      # "whether you approve the package in the CLI or on npmjs.com", and this job has no second
      # factor. That is the design and not a gap: staging is what CI is allowed to do, and deciding is
      # what a maintainer is for.
      #
      # A MISSING REPORT IS NOT A FAILURE. `is-release` is not the action's own arm predicate, so this
      # step can be reached on the staged arm in a run where the action opened a Version PR and
      # published nothing at all. The script says so and exits 0. The converse cannot happen quietly:
      # a run that really staged always leaves the file behind, because the write is the last thing
      # `stage` does and a failed write fails that step.
      - name: Report the staged version for a maintainer
        if: ${{ !cancelled() && steps.publish-floor.outputs.mode == 'staged' }}
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          STAGED_PUBLISH_REPORT: ${{ runner.temp }}/staged-publish.json
        run: |
          node .cosyte-release-tooling/scripts/staged-publish.mjs report --package "$PACKAGE_NAME"

      # `mode != 'staged'` IS THE HALF THAT KEEPS A STAGED VERSION OUT OF THIS STEP, AND IT IS HERE
      # EXPLICITLY RATHER THAN LEFT TO FOLLOW FROM `published`.
      #
      # It does follow: `staged-publish.mjs` never prints the `New tag:` marker the action reads, so
      # `published` is not `true` on the staged arm and this step would skip anyway. That is a
      # property of a string in another file, which is precisely why it is not the only thing standing
      # between a staged version and a GitHub release announcing it shipped. Cutting a release, and
      # dispatching a cosyte/docs rebuild, for a version no consumer can resolve would be a lie on a
      # public surface, and the docs site would rebuild against a version the registry will not serve.
      - name: Publish the GitHub release + dispatch docs rebuild
        if: ${{ steps.changesets.outputs.published == 'true' && steps.publish-floor.outputs.mode != 'staged' }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DISPATCH_TOKEN: ${{ secrets.DOCS_REPO_DISPATCH_TOKEN }}
          PACKAGE_NAME: ${{ inputs.package-name }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          PACK_DOCS_CMD: ${{ inputs.pack-docs-cmd }}
          DISPATCH_DOCS: ${{ inputs.dispatch-docs }}
          IS_RELEASE_COMMIT: ${{ needs.version.outputs.is-release }}
        shell: bash
        run: |
          version=$(node -e "const p=JSON.parse(process.env.PUBLISHED_PACKAGES); const m=p.find(x=>x.name===process.env.PACKAGE_NAME)||p[0]; process.stdout.write(m.version)")
          # MUST match the tag `changeset publish` just pushed, and MUST stay parseable by
          # cosyte/docs. Every caller of this workflow is a single-package repo, for which
          # Changesets tags `v<version>`; it uses `<pkg>@<version>` only in a multi-package repo.
          # This once read "${PACKAGE_NAME}@${version}", which cut a second release at a tag that
          # existed nowhere else, and docs' parseTag() (`/^(\d+)\.(\d+)\.(\d+)/` after stripping a
          # leading `v`) returns null for "@cosyte/x12@0.0.1", so the version slot it derives,
          # `versioned_docs/version-@cosyte/x12@0.0.1`, carries a `/` and is not a directory name.
          # docs keeps only releases carrying docs-content.tar.gz, so it would have selected exactly
          # that broken tag and skipped the good one.
          tag="v${version}"

          # Unreachable now that the publish command is withheld unless `is-release` is true, and
          # kept anyway: it costs one comparison, and it is the assertion that the gate above is
          # actually load-bearing rather than merely present. If it ever fires, the wiring broke.
          if [ "$IS_RELEASE_COMMIT" != "true" ]; then
            echo "::error::npm published ${PACKAGE_NAME}@${version} but the release-notes gate did not" \
                 "recognise this commit as a release. Refusing to create a release body it never derived."
            exit 1
          fi

          bash -c "$PACK_DOCS_CMD"
          assets=()
          for asset in docs-content.tar.gz source.tar.gz; do
            if [ -f "dist-artifacts/$asset" ]; then
              assets+=("dist-artifacts/$asset")
            fi
          done

          # The reconciliation, and the only check that legitimately follows the publish: it compares
          # the body against the version CHANGESETS REPORTED PUBLISHING, which does not exist until
          # the publish has happened. The body's own fitness was already proved before npm was
          # touched, by the identical `assert` call above; this run of it re-reads the same bytes
          # against the one fact that was not available then. The notes come from git, the version
          # comes from Changesets, and a disagreement between them is a defect, not a detail.
          notes="$RUNNER_TEMP/release-notes.md"
          node .cosyte-release-tooling/scripts/release-notes.mjs assert \
            --file "$notes" --expect-version "$version" --expect-package "$PACKAGE_NAME"
          echo "Release body for $tag:"
          cat "$notes"

          # The title is the tag and nothing else. The reader is already in the repo.
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "$tag" --notes-file "$notes"
            if [ ${#assets[@]} -gt 0 ]; then
              gh release upload "$tag" "${assets[@]}" --clobber
            fi
          else
            # `--target` is REQUIRED. `changeset publish` creates the v<version> tag only in the
            # runner's local clone; it was changesets/action that pushed it, and it does that ONLY
            # when createGithubReleases is true, which we turn off above to avoid a duplicate
            # release. So the tag never reaches the remote, and `gh release create` refuses with
            # "tag v0.0.1 exists locally but has not been pushed". Pointing --target at this commit
            # makes gh create the tag itself, which is what we want: one tag, one release, both
            # created here. The assets go in this same call rather than a follow-up `gh release
            # upload`: gh creates the release as a draft, uploads, and only then publishes it, so
            # there is no window in which a published release is visible without its artifacts.
            gh release create "$tag" ${assets[@]+"${assets[@]}"} \
              --target "$GITHUB_SHA" --title "$tag" --notes-file "$notes"
          fi

          # THE DOCS REBUILD. Four outcomes, and each one says so in the log, because the fifth
          # outcome -- doing nothing, quietly -- is what this actually did for its whole life.
          #
          # `-f`, NOT `-F`. `gh api -F/--field` applies magic type conversion, and one of its rules
          # is that "if the value starts with `@`, the rest of the value is interpreted as a
          # filename to read the value from" (`gh api --help`, gh 2.96.0). Every package in this org
          # is `@cosyte/*`, so `-F "client_payload[package]=@cosyte/synth"` made gh strip the `@` and
          # try to open the file `cosyte/synth`, exiting 1 with
          #   error parsing "client_payload[package]" value: open cosyte/synth: no such file or directory
          # `-f/--raw-field` is the plain-string form: no `@` interpretation, and it still builds the
          # nested object from the `client_payload[...]` keys, which is what cosyte/docs reads as
          # `github.event.client_payload.package` / `.version`.
          #
          # `version` takes `-f` too, deliberately, even though a version can never start with `@`.
          # `-F` also coerces bare integers to JSON numbers, so a hypothetical `7` would arrive typed
          # differently from `0.0.7`; and a reader who sees two flags here has to work out why they
          # differ. Neither field has any reason to be magic, so neither one is.
          #
          # WHY THIS SURFACED ON 2026-07-30 AND NOT LONG AGO. The old guard also required a non-empty
          # DOCS_REPO_DISPATCH_TOKEN, and that secret did not exist in this org until that morning.
          # The guard was false on every release this org had ever run, so this dispatch had never
          # once executed and nothing about it was ever exercised. Creating the token broke nothing:
          # it switched on a path that had been dead since it was written, with the bug waiting in
          # it. A step nothing has ever run is not a working step. That is also why the skip branch
          # below is now loud -- a path that is asked for and quietly not taken is indistinguishable
          # from one that works.
          #
          # A FAILED DISPATCH NO LONGER FAILS THE JOB, DELIBERATELY. By the time this runs, npm has
          # published (permanent, ADR 0001) and the GitHub release exists; its URL is printed a few
          # lines above. The only thing a failed dispatch costs is that docs.cosyte.com rebuilds
          # later rather than now, and a push to that repo rebuilds it anyway. Failing here made four
          # correct releases report as failed runs on 2026-07-30 (dicom 0.0.4, synth 0.0.2, deid
          # 0.0.2, terminology 0.0.4), which is worse than the miss it reports: a red conclusion on a
          # successful publish invites someone to re-run a release job that has already published,
          # and it buries a real publish failure among cosmetic ones. The run conclusion should say
          # what happened to the artifact. So this warns instead, at `::error::` level so it annotates
          # the run, with the exact command to finish the job by hand.
          #
          # STATE THE RESIDUAL RATHER THAN LEAVING IT IMPLIED. A run whose conclusion is `success`
          # notifies nobody, so nothing chases this annotation. If DOCS_REPO_DISPATCH_TOKEN expires
          # or loses its scope, every release annotates red on a green run and "docs rebuilds later"
          # becomes unbounded. What bounds it today is that `cosyte/docs` also rebuilds on any push
          # to its `main`, and its prebuild re-reads every package's latest release, so one rebuild
          # covers every dispatch that was missed. That is a real backstop and it is not a monitor.
          # The thing that would close it is the sticky-issue pattern `dispatch-receiver.yml` already
          # uses for its own failures, raised from here on the failure branch -- deliberately NOT
          # built into this fix, because a notifier is a feature and this is a one-character bug.
          if [ "$DISPATCH_DOCS" != "true" ]; then
            echo "Docs dispatch not requested (dispatch-docs=false); skipping."
          elif [ -z "$DISPATCH_TOKEN" ]; then
            echo "::warning title=Docs rebuild not triggered::dispatch-docs is true but DOCS_REPO_DISPATCH_TOKEN is unset, so cosyte/docs was never told that $PACKAGE_NAME@$version shipped."
            {
              echo "### Docs rebuild NOT triggered"
              echo ""
              echo "\`dispatch-docs\` is \`true\` but \`DOCS_REPO_DISPATCH_TOKEN\` is not set for this repo,"
              echo "so docs.cosyte.com has not been told that \`$PACKAGE_NAME@$version\` shipped."
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          elif GH_TOKEN="$DISPATCH_TOKEN" gh api repos/cosyte/docs/dispatches \
                 -f event_type=package-released \
                 -f "client_payload[package]=$PACKAGE_NAME" \
                 -f "client_payload[version]=$version"; then
            echo "Dispatched package-released to cosyte/docs for $PACKAGE_NAME@$version."
          else
            echo "::error title=Docs rebuild dispatch failed::The publish and the GitHub release SUCCEEDED. Only the cosyte/docs rebuild dispatch for $PACKAGE_NAME@$version failed, and it needs running by hand."
            {
              echo "### Docs rebuild dispatch FAILED (the release itself is fine)"
              echo ""
              echo "\`$PACKAGE_NAME@$version\` published and its GitHub release exists. The only thing"
              echo "that did not happen is the docs.cosyte.com rebuild. Trigger it by hand:"
              echo ""
              echo '```bash'
              echo "gh api repos/cosyte/docs/dispatches -f event_type=package-released \\"
              echo "  -f 'client_payload[package]=$PACKAGE_NAME' -f 'client_payload[version]=$version'"
              echo '```'
            } >> "${GITHUB_STEP_SUMMARY:-/dev/null}"
          fi

      # THE POST-PUBLISH INSTALL GATE. Nothing in this pipeline has ever installed what it published.
      # Every gate above reads the working tree or a locally packed tarball, so a manifest that is
      # valid locally and meaningless remotely passes all of them, which is exactly how
      # `@cosyte/cli@0.0.1` and `0.0.2` reached the registry carrying `file:vendor/*.tgz` specifiers
      # that cannot resolve from anywhere but the machine that built them. This takes the name and
      # the version and installs them from the REGISTRY into a clean, anonymous directory, which is
      # the only question a consumer actually asks. The full reasoning, the taxonomy and the npm
      # behaviours it is built around are at the top of `scripts/install-check.mjs`.
      #
      # IT CAN FAIL THE RUN, WHICH IS THE OPPOSITE OF THE DISPATCH STEP ABOVE, DELIBERATELY. That one
      # was changed to warn because a failed dispatch meant the ARTIFACT WAS FINE and only a
      # notification was missing, so a red conclusion misreported it. Here a positive finding means
      # the artifact itself is defective: published, permanent, and uninstallable. A red conclusion is
      # then the most accurate thing that can be said about the release, not a misreport of it. The
      # dispatch also had a real backstop (any push to cosyte/docs rebuilds and re-reads every
      # release); nothing anywhere re-checks installability, which is the whole premise of this gate.
      # The preferred design, a sticky issue, is UNAVAILABLE: it needs `issues: write`, a called
      # workflow's token can only be equal to or more restrictive than the caller's, and no caller
      # grants it. Requesting more than a caller grants is an escalation and GitHub rejects the whole
      # workflow at startup, for all thirteen callers at once. So the menu is {warn, fail}, and a
      # warning on a green run notifies nobody.
      #
      # THAT MECHANISM IS EXACTLY WHY `actions: read` AT THE TOP OF THIS FILE HAS A CALLER-SIDE
      # PRECONDITION, and it is the one permission that is now expected in a caller's `permissions:`
      # block alongside contents/id-token/pull-requests. The difference is that a reviewer decided to
      # pay for it: `actions: read` is a READ that proves the human gate on this publish, and the
      # thirteen grants are a one-line change each. `issues: write` is a write, buys a notifier, and
      # nobody has made that call. Read "THE CALLER-SIDE PRECONDITION" at the top before adding a
      # third.
      #
      # WHAT IT WILL NOT DO IS RED A CORRECT RELEASE. It exits non-zero only on a positive
      # determination: a non-registry specifier in the manifest THE REGISTRY SERVES, or a clean
      # install that failed after the retry budget, with the registry having ANSWERED for every
      # dependency the package declares, for a reason the allowance does not name. Registry
      # propagation lag, a declared unpublished dependency, a dependency the registry would not answer
      # for at all, a network fault, a timed-out install, and any unexpected throw inside the script
      # all warn and exit 0.
      #
      # The retry wraps the whole attempt rather than just our own name, because this org publishes in
      # waves and a sibling published seconds ago is just as unpropagated; reading that as a permanent
      # absence would red a correct release. Every failure the allowance has not ALREADY SETTLED
      # spends the whole budget before a verdict is taken.
      #
      # `!cancelled()` rather than `success()` so that a failure in the release/dispatch step above
      # does not skip the one check that says whether the thing on the registry can be installed. The
      # `published == 'true'` half is the same predicate the step above uses, which is a predicate
      # this org has watched fire on real releases rather than one written and never taken.
      #
      # AND IT MUST NOT BE POINTED AT A STAGED VERSION, WHICH IS THE `mode != 'staged'` CLAUSE BELOW.
      # This gate installs the name and the version FROM THE REGISTRY. A staged version is not
      # resolved by an ordinary install until it is approved, so the registry would correctly refuse
      # to serve it, and this gate's retry ladder would then spend its whole 540s deadline budget
      # proving a fact that is already known and expected. It would warn rather than red, which is the
      # fail-open design working, but a 9-minute step asserting the wrong thing is not a check.
      - name: The published package must be installable from the registry
        if: ${{ !cancelled() && steps.changesets.outputs.published == 'true' && steps.publish-floor.outputs.mode != 'staged' }}
        # THE OUTERMOST OF FOUR NESTED BOUNDS, AND DELIBERATELY THE ONE THAT SHOULD NEVER FIRE.
        # This job holds a PROTECTED `release` environment while it runs, so the step cannot be left
        # on the six-hour job default. But reaching THIS bound is a killed step, which is a RED RUN
        # on a publish that has already happened, so the script carries its own inner bounds and is
        # expected to stop itself first:
        #
        #   fetch          30s   `globalThis.fetch` has NO default timeout; one unbounded fetch
        #                        against a socket that accepts and never answers was measured
        #                        stalling 300.8s.
        #   npm install   180s   killed and fed back as an ordinary retryable failure.
        #   gate deadline 540s   checked before each attempt AND inside the dependency sweep; yields
        #                        `deadline-exceeded`, which WARNS and exits 0.
        #   this step      15m   the backstop, and a red run if it ever fires.
        #
        # Worst case an admitted attempt can cost, written down because the margin is what protects
        # the run and it is otherwise invisible: the deadline admits an attempt while elapsed <= 360s,
        # and an admitted attempt then costs at most 3 fetches (90s) + install (180s) + two entry
        # probes (120s) = 750s against this 900s bound. THE ENTRY PROBES RUN AFTER THE DEADLINE CHECK
        # AND ARE NOT RE-CHECKED AGAINST IT, so adding a third probe, or raising any inner bound,
        # spends that 150s margin. Re-derive this sum before changing any number above.
        timeout-minutes: 15
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
          PUBLISHED_PACKAGES: ${{ steps.changesets.outputs.publishedPackages }}
          EXPECT_UNPUBLISHED_DEPS: ${{ inputs.expect-unpublished-deps }}
        shell: bash
        run: |
          version=$(node -e "const p=JSON.parse(process.env.PUBLISHED_PACKAGES); const m=p.find(x=>x.name===process.env.PACKAGE_NAME)||p[0]; process.stdout.write(m.version)")
          node .cosyte-release-tooling/scripts/install-check.mjs \
            --package "$PACKAGE_NAME" --version "$version" \
            --expect-unpublished-deps "$EXPECT_UNPUBLISHED_DEPS"

      # When a publish fails, npm writes the only useful diagnostic to
      # /home/runner/.npm/_logs/<timestamp>-debug-0.log on an ephemeral runner, and nothing preserves
      # it. Every failed publish this org has had discarded exactly the file the registry then asks
      # for: @cosyte/fhir's E403 name-similarity ticket needed it and could not be given it. These
      # two steps keep it.
      #
      # REDACTION. Measured on 2026-07-27 against npm 10.9.8 with an `_authToken` in .npmrc and
      # `NODE_AUTH_TOKEN` set: at `--loglevel silly` the log records only config FILE PATHS, never
      # their contents, and no Authorization header. So today's log is clean. The redaction below is
      # defensive anyway, because the npm version moves under us, these are PUBLIC repos, and
      # artifacts are downloadable by anyone with read access. If anything credential-shaped survives
      # redaction the upload is skipped: a support diagnostic is not worth a leaked token.
      #
      # The GitHub-token SHAPE patterns (`ghp_`/`gho_`/`ghs_`/`github_pat_`) were added with
      # `RELEASE_PR_TOKEN`, because that put a second class of credential on this runner. They are
      # NOT covered by the 2026-07-27 measurement above and were not re-measured: npm's log records
      # config paths rather than contents and never reads `~/.netrc`, so the expected hit rate is
      # zero. They are here on the same defensive grounds as the rest, not on evidence.
      #
      # A rule for netrc's space-separated `password <token>` form was written and then REMOVED. It
      # is redundant against the shape rules above for anything that could actually leak here, and it
      # rewrites ordinary English: npm's own "incorrect or missing password is required" becomes
      # "password REDACTED is required". This step exists so the next E403 ticket has a READABLE log,
      # so a redaction that corrupts diagnostic prose costs more than it buys.
      - name: Collect the npm debug log
        if: failure()
        id: npm-log
        env:
          PACKAGE_NAME: ${{ inputs.package-name }}
        shell: bash
        run: |
          shopt -s nullglob
          logs=(~/.npm/_logs/*.log)
          if [ ${#logs[@]} -eq 0 ]; then
            echo "No npm debug log under ~/.npm/_logs, so this failure was not a publish. Nothing to collect."
            exit 0
          fi
          dest="$RUNNER_TEMP/npm-debug-logs"
          mkdir -p "$dest"
          for log in "${logs[@]}"; do
            sed -E \
              -e 's/(_authToken|_auth|_password|authToken)([[:space:]]*[=:][[:space:]]*)[^[:space:]]+/\1\2REDACTED/gI' \
              -e 's/([Aa]uthorization[^[:alnum:]]{0,4})(([Bb]earer|[Bb]asic)[[:space:]]+)[A-Za-z0-9._~+=\/-]+/\1\2REDACTED/g' \
              -e 's/npm_[A-Za-z0-9]{36}/npm_REDACTED/g' \
              -e 's/gh[pousr]_[A-Za-z0-9]{36,}/gh_REDACTED/g' \
              -e 's/github_pat_[A-Za-z0-9_]{22,}/github_pat_REDACTED/g' \
              "$log" > "$dest/$(basename "$log")"
          done
          # Assert on the bytes that would be uploaded, not on the fact that sed ran.
          if grep -rqiE 'npm_[A-Za-z0-9]{36}|gh[pousr]_[A-Za-z0-9]{36,}|github_pat_[A-Za-z0-9_]{22,}|(_auth|_authToken|_password)[[:space:]]*[=:][[:space:]]*[^R[:space:]]|(bearer|basic)[[:space:]]+[A-Za-z0-9._~+=/-]{16,}' "$dest"; then
            echo "::error::Credential-shaped text survived redaction in the npm debug log, so it will NOT be uploaded. Fix the redaction in cosyte/.github before relying on this artifact."
            rm -rf "$dest"
            exit 1
          fi
          version=$(node -p "require('./package.json').version" 2>/dev/null || echo unknown)
          slug=$(printf '%s' "$PACKAGE_NAME" | tr '@/' '--' | sed 's/^-*//')
          {
            echo "collected=true"
            echo "artifact-name=npm-debug-log-${slug}-${version}-run${GITHUB_RUN_ID}-attempt${GITHUB_RUN_ATTEMPT}"
          } >> "$GITHUB_OUTPUT"
          echo "Collected ${#logs[@]} npm debug log(s) for ${PACKAGE_NAME}@${version}."
      - name: Upload the npm debug log
        if: ${{ failure() && steps.npm-log.outputs.collected == 'true' }}
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.npm-log.outputs.artifact-name }}
          path: ${{ runner.temp }}/npm-debug-logs/*.log
          if-no-files-found: warn
          retention-days: 30
