name: Self PR title

# Runs `pr-title.yml` on this repository's own pull requests. The check every caller is offered is
# then one this repository's own titles pass, and a change to it runs on the pull request that makes
# the change, before any caller can adopt it.
on:
  pull_request:
    branches: [main]
    # `edited`: a title changed after the last push is the title that lands, so it is checked again.
    types: [opened, synchronize, reopened, edited]

# No concurrency group. A push and a title edit can arrive together (Dependabot does both), and a
# run a group cancels, even a queued one under `cancel-in-progress: false`, can count as a failed
# check and block the merge until someone re-runs it. Each run takes seconds, so every one finishes
# and the newest result stands.

permissions:
  contents: read

jobs:
  pr-title:
    permissions:
      contents: read
    uses: ./.github/workflows/pr-title.yml
