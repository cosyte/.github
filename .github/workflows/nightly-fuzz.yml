name: Nightly fuzz

# Reusable fuzz run for the byte-level parsers (dicom Part 10, mllp framing).
# Caller (each byte parser's .github/workflows/nightly-fuzz.yml):
#   on:
#     schedule: [{ cron: "0 6 * * *" }]
#     workflow_dispatch: {}
#   jobs:
#     fuzz:
#       uses: cosyte/.github/.github/workflows/nightly-fuzz.yml@workflows-YYYY-MM-DD-COMMIT
# Arbitrary/malformed bytes must never crash, hang, or OOM: they degrade to a typed error or warning.
#
# ▶ NAME A PUBLISHED REFERENCE, NOT `@main`. A reference at the default branch delivers every later
#   change made here on THIS repository's clock rather than yours, reviewed by nobody in your
#   repository; a published reference names one commit and never moves. Take the newest from
#   https://github.com/cosyte/.github/releases, whose notes say what adopting it asks of a caller.
#   README.md, "The published reference", owns the rest.

on:
  workflow_call:
    inputs:
      fuzz-cmd:
        description: "The fuzz command to run."
        type: string
        default: "pnpm fuzz"
      node-version:
        type: string
        default: "22"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6.0.10
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: ${{ inputs.node-version }}
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Fuzz
        env:
          FUZZ_CMD: ${{ inputs.fuzz-cmd }}
        run: bash -c "$FUZZ_CMD"
