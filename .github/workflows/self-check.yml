name: Self-check

# Lints the reusable workflows in this repo. Reusable (workflow_call) workflows don't run on push by
# themselves, so this is what keeps them valid.
#
# It also runs the unit tests for scripts/, which is where the release-notes derivation and the gate
# that refuses meaningless release bodies live. That code runs in 8+ public repos behind a protected
# environment, so it is awkward to iterate on there and has to be proved here.
#
# And it checks the package lists in the community files and the org profile against the catalog
# of our libraries (`package-lists`).
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    # The nightly run, 05:45 UTC: off the hour, since GitHub delays scheduled runs at each hour's start.
    - cron: "45 5 * * *"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # The same pinned release binary as `ci.yml`'s `actionlint` job, at the same version and SHA-256,
  # for the reason written there: reviewdog/action-actionlint installs actionlint from a fork from
  # v1.75.0. The job's exit status is actionlint's own, over every tracked workflow file, on a pull
  # request, a push and the nightly run alike.
  actionlint:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      ACTIONLINT_VERSION: "1.7.12"
      ACTIONLINT_SHA256: "8aca8db96f1b94770f1b0d72b6dddcb1ebb8123cb3712530b08cc387b349a3d8"
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # THE RELEASE TARBALL IS CACHED, keyed on the version and the SHA-256, so a run that finds it
      # never asks GitHub's release downloads, which answered 504 for hours on 2026-11-08 and failed
      # this job everywhere. The cache is only where the bytes come from: the install step checks the
      # SHA-256 of whatever it unpacks, cached or downloaded, so a cache entry is trusted no further
      # than a download. A cache that cannot be reached is a miss with a warning, never a failure.
      - name: Restore the actionlint release from the cache
        id: actionlint-cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint-cache
          key: actionlint-${{ env.ACTIONLINT_VERSION }}-linux-amd64-${{ env.ACTIONLINT_SHA256 }}
      # A cached tarball whose hash matches is unpacked as it is. Anything else (no cached copy, or
      # one that does not match) is downloaded, with bounded retries and curl's own backoff, and the
      # download is checked against the same SHA-256 before it is unpacked.
      - name: Install actionlint at the pinned version and checksum
        shell: bash
        run: |
          set -euo pipefail
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          cache_dir="${RUNNER_TEMP}/actionlint-cache"
          if [ -f "${cache_dir}/${tarball}" ] \
            && echo "${ACTIONLINT_SHA256}  ${cache_dir}/${tarball}" | sha256sum -c --status -; then
            echo "actionlint ${ACTIONLINT_VERSION}: the cached release matches the pinned SHA-256."
          else
            if [ -f "${cache_dir}/${tarball}" ]; then
              echo "::warning::the cached actionlint release does not match the pinned SHA-256, so it is downloaded again"
            fi
            mkdir -p "${cache_dir}"
            curl -fsSL --retry 5 --retry-connrefused --retry-max-time 120 --connect-timeout 20 \
              -o "${cache_dir}/${tarball}" \
              "https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}/${tarball}"
          fi
          echo "${ACTIONLINT_SHA256}  ${cache_dir}/${tarball}" | sha256sum -c -
          tar -xzf "${cache_dir}/${tarball}" -C "${RUNNER_TEMP}" actionlint
          "${RUNNER_TEMP}/actionlint" --version
          shellcheck --version
      # Saved straight after the checked install and before the lint, so a pull request whose lint
      # finds something still seeds the cache. Only on a miss: an entry is never rewritten, and a
      # failed save is a warning. This step runs only after the install step passed, so what it
      # saves is a tarball whose SHA-256 was just checked.
      - name: Save the actionlint release to the cache
        if: ${{ steps.actionlint-cache.outputs.cache-hit != 'true' }}
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}/actionlint-cache
          key: ${{ steps.actionlint-cache.outputs.cache-primary-key }}
      - name: actionlint over .github/workflows/
        shell: bash
        run: |
          set -euo pipefail
          listed="$(git ls-files -- '.github/workflows/*.yml' '.github/workflows/*.yaml')"
          if [ -z "${listed}" ]; then
            echo "::error::no workflow file found under .github/workflows/"
            exit 1
          fi
          mapfile -t files <<< "${listed}"
          "${RUNNER_TEMP}/actionlint" -color "${files[@]}"
          echo "actionlint clean over ${#files[@]} workflow file(s)."

  scripts:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      # Zero dependencies on purpose: node:test and node:assert only, so this repo needs no
      # package.json, no lockfile, and no install step to stay verifiable.
      - name: Unit tests
        run: node --test "test/*.test.mjs"

  # The package lists in SECURITY.md, CONTRIBUTING.md and profile/README.md against the catalog in
  # the latest @cosyte/script-utils on npm, which cosyte/config generates from each library's
  # package.json. The latest, not a pin: a release that changes the catalog turns the next run red,
  # the nightly one included, until the lists follow it. `npm pack` fetches the tarball and runs none
  # of its code; the check reads catalog.json out of it. Its own job, so the registry being out of
  # reach never fails the unit tests above.
  package-lists:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
      - name: The package lists follow the catalog
        run: node test/package-lists.mjs

  # `ci.yml` ITSELF, on every system and runtime, against `test/fixtures/ci-caller/`: a package whose
  # scripts each fail on the hazard they stand for (a carriage return from a Windows checkout, a
  # dash or PHI checker that cannot run or finds nothing, a run on the wrong system, a missing
  # export target). `verify` runs on Linux, Windows and macOS at every default Node line, and `bun`
  # and `deno` run the fixture's test script under Bun and Deno, so a change to a shared step is
  # proven on all three systems here, before a caller adopts it. `prepublish` and `actionlint` are
  # off: they read the repository root, which is not a package, and this repository's own
  # `actionlint` job above already lints every workflow file.
  #
  # `scaling-gate` and `bench-compare` run here with the REAL tools, `@cosyte/test-utils` and
  # `@cosyte/bench`, from the fixture's lockfile: the fixture's `test:perf` runs the scaling gate and
  # its self-check on a synthetic split, and `bench/greeting.bench.mjs` is the suite the comparison
  # times on this pull request's base and head. `performance-artifacts` below reads what it kept.
  systems:
    uses: ./.github/workflows/ci.yml
    with:
      working-directory: test/fixtures/ci-caller
      os: '["ubuntu-latest", "windows-latest", "macos-latest"]'
      run-phi-scan: true
      check-docs-content: true
      run-bun: true
      run-deno: true
      run-coverage-ratchet: true
      run-mutation: true
      run-scaling-gate: true
      run-bench-compare: true
      run-actionlint: false
      run-prepublish-manifest-lint: false
      run-prepublish-install: false

  # THE TESTING STANDARD'S JOBS, against the same fixture. `systems` above turns on `ci.yml`'s
  # `coverage-ratchet` and `mutation` jobs; these run the scheduled reusables. The fixture's
  # `cosyte-mutate` and `cosyte-ratchet` are the stand-ins in `test/fixtures/quality-stubs/`: each
  # accepts only the command lines the real tool accepts, checks that the base ref has a merge base
  # and that the reports it would read are on disk, refuses `raise`, and judges nothing. The
  # `cosyte-mutate` stand-in also reads the two variables a sharded weekly run sets, which is the
  # contract `weekly-mutation.yml` asks of the real tool. So a green run here proves the wiring (the
  # checkout's history, the order of the steps, the directory, the shards, the cache, the merge, the
  # summary, the artifacts), not the tools.
  nightly-properties:
    uses: ./.github/workflows/nightly-properties.yml
    with:
      working-directory: test/fixtures/ci-caller
      test-cmd: pnpm run test:properties
  # A SHARDED RUN: two shards, one of which holds no file of the fixture, merged into one report.
  weekly-mutation:
    uses: ./.github/workflows/weekly-mutation.yml
    with:
      working-directory: test/fixtures/ci-caller
      shard-count: 2
  # AN INCREMENTAL RUN: the same call again, after the first. Its shards restore the incremental files
  # the first run's shards saved, so each says it started from earlier results.
  weekly-mutation-incremental:
    needs: weekly-mutation
    uses: ./.github/workflows/weekly-mutation.yml
    with:
      working-directory: test/fixtures/ci-caller
      shard-count: 2
      report-name: mutation-report-incremental
  # ONE SHARD, WITH A TOOL THAT DOES NOT SHARD: the stand-in playing @cosyte/vitest-config 0.1.4,
  # which neither names nor reads the shard variables and writes mutation.json. The run must still be
  # green, its mutation.json read as the report of shard 1 of 1.
  weekly-mutation-one-shard:
    uses: ./.github/workflows/weekly-mutation.yml
    with:
      working-directory: test/fixtures/ci-caller
      shard-count: 1
      mutate-cmd: COSYTE_MUTATE_STUB_AS=0.1.4 pnpm exec cosyte-mutate full
      report-name: mutation-report-one-shard

  # What the runs kept. The fixture's `test:properties` requires COSYTE_PROPERTY_RUNS to be a whole
  # number and prints a planted failure report in colour, so the nightly artifact must hold its seed,
  # once, at the depth the reusable set. The weekly artifact must hold the merged report, the
  # ratchet's own report beside it, and a note from each of its two shards; the second weekly run's
  # notes must each say the shard started from the first run's results; and the one-shard run's
  # merged report must be the stand-in's mutation.json.
  #
  # ACROSS RUNS, NOT ONLY WITHIN ONE: each shard of the first weekly call must have restored an
  # entry an earlier run of this workflow saved, which the run id in the restored key tells apart
  # from this run's. A pull request reads its own branch's entries and then the default branch's,
  # and the nightly run keeps them read. With no earlier entry at all (a fresh fork, or entries
  # GitHub evicted) that step is red once, and the run after it, which finds this one's, is green.
  quality-artifacts:
    needs: [nightly-properties, weekly-mutation, weekly-mutation-incremental, weekly-mutation-one-shard]
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: ${{ runner.temp }}/artifacts
      - name: The seeds and the reports reached their artifacts
        shell: bash
        run: |
          set -euo pipefail
          artifacts="${RUNNER_TEMP}/artifacts"
          cat "${artifacts}/property-run/seeds.txt"
          grep -F 'Nightly property run at COSYTE_PROPERTY_RUNS=10000: 1 replay seed(s).' "${artifacts}/property-run/seeds.txt"
          grep -F 'replay: COSYTE_PROPERTY_SEED=20261110 COSYTE_PROPERTY_PATH=0:1' "${artifacts}/property-run/seeds.txt"
          test -s "${artifacts}/property-run/test.log"
          test -s "${artifacts}/mutation-report/mutation.json"
          cat "${artifacts}/mutation-report/ratchet.txt"
          grep -F 'cosyte-ratchet check (a stand-in)' "${artifacts}/mutation-report/ratchet.txt"
          grep -F '  read reports/mutation/mutation.json' "${artifacts}/mutation-report/ratchet.txt"
          jq -e '.files | has("src/index.mjs")' "${artifacts}/mutation-report/mutation.json"
          cat "${artifacts}/mutation-report/shards.txt"
          test "$(wc -l < "${artifacts}/mutation-report/shards.txt")" -eq 2
          cat "${artifacts}/mutation-report-incremental/shards.txt"
          test "$(grep -c ': incremental, ' "${artifacts}/mutation-report-incremental/shards.txt")" -eq 2
          test -s "${artifacts}/mutation-report-incremental/mutation.json"
          test -s "${artifacts}/mutation-report-one-shard/mutation.json"
          cat "${artifacts}/mutation-report-one-shard/shards.txt"
          test "$(wc -l < "${artifacts}/mutation-report-one-shard/shards.txt")" -eq 1
          grep -F 'read as the report of shard 1 of 1' "${artifacts}/mutation-report-one-shard/shards.txt"
      - name: The first weekly run started from an earlier run's results
        shell: bash
        run: |
          set -euo pipefail
          notes="${RUNNER_TEMP}/artifacts/mutation-report/shards.txt"
          across=0
          while IFS= read -r line; do
            shard="${line%%:*}"
            case "${line}" in
              *": incremental, "*" restored from "*) ;;
              *)
                echo "::error::${shard} started from no earlier run's results: ${line}"
                exit 1
                ;;
            esac
            key="${line##* restored from }"
            attempt="${key##*-}"
            rest="${key%-*}"
            run="${rest##*-}"
            if [ "${run}" = "${GITHUB_RUN_ID}" ] && [ "${attempt}" -ge "${GITHUB_RUN_ATTEMPT}" ]; then
              echo "::error::${shard} restored results this run saved (${key}), not an earlier run's"
              exit 1
            fi
            echo "${shard}: restored the results of run ${run}, attempt ${attempt}"
            across=$((across + 1))
          done < "${notes}"
          if [ "${across}" -ne 2 ]; then
            echo "::error::${across} of the 2 shards restored an earlier run's results"
            exit 1
          fi

  # THE RELEASE GATES' SCRIPTS, run for real, none of them able to publish: `release.yml` itself cannot
  # run here (it needs a protected environment and publishes), so each script it runs before the
  # publish is run on this repository and the fixture instead. The mutation gate reads a real
  # workflow's latest run through the API with this job's token at `actions: read` and must reach a
  # verdict (a pass or a refusal, never an unreadable result), and must skip a workflow file that is
  # not there. The samples gate packs the fixture, installs the tarball into a clean directory and
  # runs `release-samples/greeting.md` against it. The SBOM is written from the fixture's installed
  # production tree and must be CycloneDX naming the fixture.
  release-gates:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      actions: read
    defaults:
      run:
        working-directory: test/fixtures/ci-caller
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1
        with:
          package_json_file: test/fixtures/ci-caller/package.json
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: test/fixtures/ci-caller/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - name: The mutation gate reads a real run, and skips a workflow that is not there
        shell: bash
        working-directory: .
        env:
          GH_TOKEN: ${{ github.token }}
          DEFAULT_BRANCH_HINT: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          status=0
          node scripts/mutation-gate.mjs --repo . --workflow self-check.yml --max-age-days 8 || status=$?
          if [ "${status}" -ne 0 ] && [ "${status}" -ne 1 ]; then
            echo "::error::the mutation gate could not read self-check.yml's latest run (exit ${status})"
            exit 1
          fi
          skipped="$(node scripts/mutation-gate.mjs --repo . --workflow no-such-weekly-mutation.yml --max-age-days 8)"
          echo "${skipped}"
          grep -F 'mutation gate skipped: ' <<< "${skipped}"
      - name: The docs samples run against the fixture's packed tarball
        shell: bash
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/scripts/tarball-samples.mjs" --repo . --docs-dir release-samples | tee "${RUNNER_TEMP}/samples.txt"
          grep -F 'ran release-samples/greeting.md:7' "${RUNNER_TEMP}/samples.txt"
          grep -F 'samples gate: 1 sample(s) ran against the tarball, 0 not run, 0 failed' "${RUNNER_TEMP}/samples.txt"
      - name: The SBOM is CycloneDX and names the fixture
        shell: bash
        run: |
          set -euo pipefail
          node "${GITHUB_WORKSPACE}/scripts/sbom.mjs" --repo . --out "${RUNNER_TEMP}/sbom/sbom.cdx.json"
          jq -e '.bomFormat == "CycloneDX" and .specVersion == "1.5" and .metadata.component.name == "ci-caller-fixture" and (.components | type) == "array"' "${RUNNER_TEMP}/sbom/sbom.cdx.json"

  # What `bench-compare` kept, on a pull request (the only event it runs on). The comparison ends
  # green whatever it measured, so this is what turns a comparison that wrote nothing, or wrote a
  # document of another kind, into a red check here: the artifact must hold the fixture suite's
  # results document, a results-v1 `comparison`, and its Markdown.
  performance-artifacts:
    needs: [systems]
    if: ${{ github.event_name == 'pull_request' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: bench-comparison
          path: ${{ runner.temp }}/bench-comparison
      - name: The comparison kept a results-v1 document
        shell: bash
        run: |
          set -euo pipefail
          kept="${RUNNER_TEMP}/bench-comparison"
          ls -l "${kept}"
          test -s "${kept}/bench-greeting.md"
          results="${kept}/bench-greeting.json"
          jq -r '.comparison.cases[] | "\(.benchmark) \(.size): \(.verdict), \(.ratios | length) round(s)"' "${results}"
          if ! jq -e '.schemaVersion == 1 and .kind == "comparison" and (.comparison.cases | length) > 0' "${results}"; then
            echo "::error::${results} is not a results-v1 comparison with at least one case"
            exit 1
          fi
